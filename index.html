  }).join('')}</div>
  <p class="small muted">Kéo thả thẻ giữa các cột, hoặc dùng ô chọn trạng thái trên thẻ (dành cho thiết bị cảm ứng).</p>`;
}

// ---------- kế hoạch tháng / tuần ----------
function shiftMonth(m, n) {
  const [y, mo] = String(m || today().slice(0, 7)).split('-').map(Number);
  const d = new Date(y, mo - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

const monthLabel = m => {
  const [y, mo] = String(m).split('-');
  return `Tháng ${Number(mo)}/${y}`;
};

function weekRange() {
  const start = addDays(startOfWeek(today(), settings().weekStart), state.weekOffset * 7);
  return { start, end: addDays(start, 6) };
}

function projectsInMonth() {
  const m = state.planMonth;
  return all('projects').filter(p => {
    if (p.status === 'cancelled') return false;
    if (String(p.month || '').slice(0, 7) === m) return true;
    if (!p.month) {
      if (String(p.due || '').slice(0, 7) === m || String(p.start || '').slice(0, 7) === m) return true;
      if (!p.due && !p.start) {
        return all('tasks').some(t => t.projectId === p.id && String(t.due || '').slice(0, 7) === m);
      }
    }
    return false;
  }).sort((a, b) => {
    if ((a.status === 'done') !== (b.status === 'done')) return a.status === 'done' ? 1 : -1;
    const ad = String(a.due || '9999-99-99'), bd = String(b.due || '9999-99-99');
    if (ad !== bd) return ad.localeCompare(bd);
    return String(a.title).localeCompare(String(b.title), 'vi');
  });
}

function projectTasks(p) {
  return all('tasks').filter(t => t.projectId === p.id && t.status !== 'cancelled')
    .sort((a, b) =>
      String(a.due || '9999-99-99').localeCompare(String(b.due || '9999-99-99'))
      || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
}

function planToolbar() {
  const isMonth = state.planMode === 'month';
  const range = weekRange();
  return `<div class="plan-bar">
    <div class="tabs plan-mode" role="group" aria-label="Xem kế hoạch theo">
      <button type="button" data-plan-mode="month" class="${isMonth ? 'active' : ''}">Tháng</button>
      <button type="button" data-plan-mode="week" class="${!isMonth ? 'active' : ''}">Tuần</button>
    </div>
    <div class="plan-nav">
      <button type="button" class="btn sm ghost" data-plan-shift="-1" aria-label="Kỳ trước">‹</button>
      ${isMonth
        ? `<input type="month" data-plan-month value="${esc(state.planMonth)}" aria-label="Chọn tháng">`
        : `<strong>${esc(fmtDate(range.start))} – ${esc(fmtDate(range.end))}</strong>`}
      <button type="button" class="btn sm ghost" data-plan-shift="1" aria-label="Kỳ sau">›</button>
      <button type="button" class="btn sm" data-plan-today>Hôm nay</button>
    </div>
    <span class="spacer"></span>
    ${isMonth
      ? '<button type="button" class="btn primary" data-new-project>+ Công việc lớn</button>'
      : '<button type="button" class="btn primary" data-new-task>+ Công việc</button>'}
  </div>`;
}

function monthSummary() {
  const ps = projectsInMonth();
  const doneProjects = ps.filter(p => projectsApi.derivedStatus(p) === 'done').length;
  let done = 0, total = 0, planMin = 0;
  for (const p of ps) {
    const prog = projectsApi.progressOf(p.id);
    done += prog.done; total += prog.total; planMin += prog.minutes;
  }
  return `<div class="plan-summary">
    <span><b>${ps.length}</b> công việc lớn</span>
    <span><b>${doneProjects}</b> đã hoàn thành</span>
    <span><b>${done}/${total}</b> việc nhỏ xong</span>
    <span>Dự kiến <b>${esc(fmtDur(planMin))}</b></span>
    <span class="muted">Mục tiêu đếm các việc được tích “Tính là 1 sản phẩm”, không đếm mọi bước nhỏ.</span>
  </div>`;
}

function childRow(t, showProject = false) {
  const actual = sessionMinutes(all('sessions'), t.id);
  const steps = taskProgress(t);
  const due = String(t.due || '').slice(0, 10);
  const product = safeUrl(t.productLink);
  return `<div class="pc-child${t.status === 'done' ? ' is-done' : ''}" data-id="${esc(t.id)}">
    <input type="checkbox" data-child-done aria-label="Hoàn thành việc nhỏ"${t.status === 'done' ? ' checked' : ''}>
    <div class="pc-child-main">
      <button type="button" class="pc-child-title" data-edit="${esc(t.id)}">${esc(t.title)}</button>
      <div class="pc-child-meta">
        ${statusPill(t.status)}
        ${showProject && t.projectId ? `<span class="tag">${esc(projectTitle(t))}</span>` : ''}
        ${due
          ? `<span class="tag${isOverdue(t) ? ' tag-red' : ''}">${esc(fmtDate(due))}${isOverdue(t) ? ` · trễ ${overdueDays(t)}n` : ''}</span>`
          : '<span class="tag">chưa xếp ngày</span>'}
        <span class="tag">dự kiến ${esc(fmtDur(t.estimatedMin))}</span>
        <span class="tag">thực tế ${actual ? esc(fmtDur(actual)) : '—'}</span>
        ${steps.total ? `<span class="tag">${steps.done}/${steps.total} bước</span>` : ''}
        ${t.isOutput ? '<span class="tag">tính sản phẩm</span>' : ''}
        ${product ? `<a class="tag tag-link" href="${esc(product)}" target="_blank" rel="noopener">Link sản phẩm</a>` : ''}
        ${isTaskRunning(t) ? '<span class="pill blue">đang tính giờ</span>' : ''}
      </div>
    </div>
    <div class="pc-child-actions">
      <button type="button" class="btn sm ghost" data-timer title="${isTaskRunning(t) ? 'Tạm dừng tính giờ' : 'Bắt đầu tính giờ'}">${isTaskRunning(t) ? '⏸' : '▶'}</button>
      <button type="button" class="btn sm ghost" data-del-child title="Xoá việc nhỏ">×</button>
    </div>
  </div>`;
}

function projectCard(p) {
  const prog = projectsApi.progressOf(p.id);
  const items = projectTasks(p);
  const actual = items.reduce((sum, t) => sum + sessionMinutes(all('sessions'), t.id), 0);
  const liveStatus = projectsApi.derivedStatus(p);
  const pct = (prog.total || prog.target) ? prog.pct : (liveStatus === 'done' ? 100 : 0);
  const overdue = items.filter(t => isOverdue(t)).length;
  const todayCount = items.filter(t => String(t.due || '').slice(0, 10) === today() && t.status !== 'done').length;
  const product = safeUrl(p.productLink);
  return `<section class="card project-card${liveStatus === 'done' ? ' is-done' : ''}" data-project="${esc(p.id)}">
    <div class="pc-head">
      <div class="pc-title">
        <span class="tg-kicker">Công việc lớn</span>
        <button type="button" class="pc-name" data-edit-project="${esc(p.id)}">${esc(p.title)}</button>
        <div class="chips">
          ${statusPill(liveStatus)}
          ${priorityPill(p.priority)}
          <span class="tag">${esc(groupName(p.groupId))}</span>
          ${p.due ? `<span class="tag">Hạn ${esc(fmtDate(p.due))}</span>` : ''}
          ${prog.target ? `<span class="tag">Mục tiêu ${prog.target} sản phẩm</span>` : ''}
          ${prog.target && prog.reached ? '<span class="pill green">Đã đạt</span>' : ''}
          ${prog.target && prog.total && !prog.hasMarks ? '<span class="pill amber">Chưa đánh dấu bước tính sản phẩm</span>' : ''}
          ${overdue ? `<span class="pill red">${overdue} quá hạn</span>` : ''}
          ${todayCount ? `<span class="pill blue">${todayCount} hôm nay</span>` : ''}
          ${product ? `<a class="tag tag-link" href="${esc(product)}" target="_blank" rel="noopener">Link sản phẩm</a>` : ''}
        </div>
      </div>
      <div class="pc-progress">
        <strong>${pct}%</strong>
        <span class="small muted">${prog.target
          ? `${prog.outputs}/${prog.target} sản phẩm`
          : `${prog.done}/${prog.total} việc nhỏ`}</span>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <span class="small muted">${prog.target ? `${prog.done}/${prog.total} việc nhỏ · ` : ''}Dự kiến ${esc(fmtDur(prog.minutes))} · Thực tế ${actual ? esc(fmtDur(actual)) : '—'}</span>
      </div>
      <div class="pc-actions">
        <button type="button" class="btn sm" data-add-child="${esc(p.id)}">+ Việc nhỏ</button>
        <button type="button" class="btn sm ghost" data-edit-project="${esc(p.id)}">Sửa</button>
        <button type="button" class="btn sm ghost" data-del-project="${esc(p.id)}" title="Xoá công việc lớn">×</button>
      </div>
    </div>
    <div class="pc-children">
      ${items.length
        ? items.map(t => childRow(t)).join('')
        : '<p class="pc-empty small muted">Chưa có việc nhỏ. Thêm việc nhỏ bên dưới.</p>'}
    </div>
    <div class="pc-foot">
      <button type="button" class="btn sm ghost" data-add-child="${esc(p.id)}">+ Thêm việc nhỏ</button>
      <span class="spacer"></span>
      <span class="small muted">${prog.total
        ? (prog.target
          ? 'Tích “Tính là 1 sản phẩm” ở bước đăng / giao sản phẩm để cộng vào mục tiêu.'
          : 'Mở việc nhỏ để gắn link sản phẩm.')
        : ''}</span>
    </div>
  </section>`;
}

function unassignedHtml() {
  const list = all('tasks').filter(t => !t.projectId && t.status !== 'cancelled');
  if (!list.length) return '';
  const sorted = [...list].sort((a, b) =>
    (a.status === 'done') - (b.status === 'done')
    || String(a.due || '9999-99-99').localeCompare(String(b.due || '9999-99-99'))
    || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  const shown = sorted.slice(0, 25);
  return `<section class="card up-card">
    <div class="card-head">
      <h2>Việc chưa gắn đầu mục</h2>
      <span class="tag">${list.filter(t => t.status !== 'done').length} chưa xong</span>
      <div class="spacer"></div>
      <span class="small muted">Sửa việc và chọn “Thuộc công việc lớn”.</span>
    </div>
    <div class="pc-children">${shown.map(t => childRow(t)).join('')}</div>
    ${sorted.length > shown.length ? `<div class="pc-foot"><span class="small muted">Còn ${sorted.length - shown.length} việc khác trong Danh sách.</span></div>` : ''}
  </section>`;
}

function monthPlanHtml() {
  const ps = projectsInMonth();
  if (!ps.length) {
    const monthIndex = m => Number(m.slice(0, 4)) * 12 + Number(m.slice(5, 7));
    const baseIndex = monthIndex(state.planMonth);
    const otherMonths = [...new Set(all('projects')
      .filter(p => p.status !== 'cancelled' && String(p.month || '').slice(0, 7))
      .map(p => String(p.month).slice(0, 7)))]
      .filter(m => m !== state.planMonth)
      .sort((a, b) => Math.abs(monthIndex(a) - baseIndex) - Math.abs(monthIndex(b) - baseIndex) || a.localeCompare(b))
      .slice(0, 4);
    const jump = otherMonths.length
      ? `<div class="row" style="margin-top:12px;justify-content:center;flex-wrap:wrap">
          <span class="small muted">Tháng đã có kế hoạch:</span>
          ${otherMonths.map(m => `<button type="button" class="btn sm" data-plan-goto="${m}">${esc(monthLabel(m))}</button>`).join('')}
        </div>`
      : '';
    return `${planToolbar()}
      <div class="card"><div class="card-body">
        ${emptyState('Tháng này chưa có công việc lớn',
          'Tạo đầu mục cho tháng, đặt số lượng sản phẩm cần đạt, rồi thêm các việc nhỏ bên trong.',
          '<button class="btn primary" data-new-project>+ Công việc lớn</button>')}
        ${jump}
      </div></div>
      ${unassignedHtml()}`;
  }
  return `${planToolbar()}${monthSummary()}
    <div class="task-groups">${ps.map(projectCard).join('')}</div>
    ${unassignedHtml()}`;
}

function weekPlanHtml() {
  const { start } = weekRange();
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const tasks = all('tasks').filter(t => t.status !== 'cancelled');
  const byDay = new Map(days.map(d => [d, []]));
  for (const t of tasks) {
    const d = String(t.due || '').slice(0, 10);
    if (byDay.has(d)) byDay.get(d).push(t);
  }
  for (const arr of byDay.values()) {
    arr.sort((a, b) =>
      (a.status === 'done') - (b.status === 'done')
      || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  }
  const unscheduled = tasks.filter(t => !t.due && t.status !== 'done')
    .sort((a, b) => (a.status === 'done') - (b.status === 'done')
      || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));

  return `${planToolbar()}
    <div class="day-plan">${days.map(d => {
      const items = byDay.get(d);
      const est = items.reduce((sum, t) => sum + (Number(t.estimatedMin) || 0), 0);
      const done = items.filter(t => t.status === 'done').length;
      return `<section class="day-card${d === today() ? ' is-today' : ''}">
        <div class="day-head">
          <strong>${esc(weekdayName(d))}</strong>
          <span class="small muted">${esc(fmtDate(d))}</span>
          ${d === today() ? '<span class="pill blue">hôm nay</span>' : ''}
          <span class="spacer"></span>
          <span class="small muted">${done}/${items.length} xong · ${esc(fmtDur(est))}</span>
          <button type="button" class="btn sm ghost" data-add-day="${d}" aria-label="Thêm việc vào ${esc(fmtDate(d))}">+</button>
        </div>
        <div class="day-body">
          ${items.length ? items.map(t => childRow(t, true)).join('') : '<p class="day-empty small muted">Chưa có việc.</p>'}
        </div>
      </section>`;
    }).join('')}</div>
    ${unscheduled.length ? `<section class="card up-card">
      <div class="card-head">
        <h2>Chưa xếp ngày</h2>
        <span class="tag">${unscheduled.length}</span>
        <div class="spacer"></div>
        <span class="small muted">Mở việc để đặt deadline, hoặc thêm việc mới cho tuần.</span>
      </div>
      <div class="pc-children">${unscheduled.slice(0, 30).map(t => childRow(t, true)).join('')}</div>
    </section>` : ''}`;
}

function bodyHtml() {
  if (state.tab === 'plan') return state.planMode === 'week' ? weekPlanHtml() : monthPlanHtml();
  if (state.tab === 'kanban') return kanbanHtml();
  return listHtml();
}

function shell(view) {
  const projects = all('projects').filter(p => p.status !== 'cancelled')
    .sort((a, b) => String(a.title).localeCompare(String(b.title), 'vi'));
  view.innerHTML = `${header()}${state.tab === 'plan' ? '' : filtersHtml(projects)}<div id="list-region">${bodyHtml()}</div>`;
}

function refresh(view) {
  const region = view.querySelector('#list-region');
  if (region) region.innerHTML = bodyHtml();
  else shell(view);
}

async function removeProject(p) {
  const kids = all('tasks').filter(t => t.projectId === p.id);
  const ok = await confirmDialog({
    title: 'Xoá công việc lớn',
    message: `Xoá "${p.title}"?`,
    details: kids.length
      ? `${kids.length} việc nhỏ bên trong và thời gian đã ghi nhận cũng sẽ bị xoá.`
      : 'Công việc lớn này chưa có việc nhỏ.',
    okLabel: 'Xoá', danger: true,
  });
  if (!ok) return;
  for (const t of kids) {
    if (timer.activeTimer()?.taskId === t.id) await timer.discard();
    await remove('tasks', t.id);
  }
  await remove('projects', p.id);
  if (state.project === p.id) state.project = '';
  toast('Đã xoá công việc lớn.', 'success');
}

function bind(view) {
  view.addEventListener('click', async e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      state.tab = tab.dataset.tab;
      state.page = 1;
      location.hash = `#/tasks${state.tab === 'plan' ? '' : `?tab=${state.tab}`}`;
      shell(view);
      return;
    }

    const mode = e.target.closest('[data-plan-mode]');
    if (mode) {
      state.planMode = mode.dataset.planMode;
      refresh(view);
      return;
    }
    const shift = e.target.closest('[data-plan-shift]');
    if (shift) {
      const n = Number(shift.dataset.planShift) || 0;
      if (state.planMode === 'month') state.planMonth = shiftMonth(state.planMonth, n);
      else state.weekOffset += n;
      refresh(view);
      return;
    }
    if (e.target.closest('[data-plan-today]')) {
      state.planMonth = today().slice(0, 7);
      state.weekOffset = 0;
      refresh(view);
      return;
    }
    const gotoMonth = e.target.closest('[data-plan-goto]');
    if (gotoMonth) {
      state.planMode = 'month';
      state.planMonth = gotoMonth.dataset.planGoto;
      refresh(view);
      return;
    }
    if (e.target.closest('[data-new-project]')) {
      openForm('project', { ...blank('project'), month: state.planMonth });
      return;
    }
    if (e.target.closest('[data-new-task]')) { openForm('task', null); return; }

    const editProject = e.target.closest('[data-edit-project]');
    if (editProject) {
      const p = find('projects', editProject.dataset.editProject);
      if (p) openForm('project', p);
      return;
    }
    const delProject = e.target.closest('[data-del-project]');
    if (delProject) {
      const p = find('projects', delProject.dataset.delProject);
      if (p) await removeProject(p);
      return;
    }
    const addChild = e.target.closest('[data-add-child]');
    if (addChild) {
      const p = find('projects', addChild.dataset.addChild);
      if (p) {
        openForm('task', {
          ...blank('task'), projectId: p.id, groupId: p.groupId,
          priority: p.priority, productLink: p.productLink || '',
        });
      }
      return;
    }
    const addDay = e.target.closest('[data-add-day]');
    if (addDay) {
      openForm('task', { ...blank('task'), due: addDay.dataset.addDay });
      return;
    }
    const delChild = e.target.closest('[data-del-child]');
    if (delChild) {
      const t = find('tasks', delChild.closest('.pc-child')?.dataset.id);
      if (t) await deleteTask(t);
      return;
    }

    if (e.target.closest('#btn-new-task')) { openForm('task', null); return; }
    if (e.target.closest('[data-clear-filters]')) {
      Object.assign(state, {
        q: '', status: '', group: '', priority: '', project: '', tag: '', from: '', to: '',
        overdueOnly: false, recurringOnly: false, hasTime: false, missingOutput: false, page: 1,
      });
      shell(view);
      return;
    }
    const pageBtn = e.target.closest('[data-page]');
    if (pageBtn) { state.page = Number(pageBtn.dataset.page) || 1; refresh(view); view.scrollIntoView(); return; }

    const edit = e.target.closest('[data-edit]');
    if (edit) { e.preventDefault(); const t = find('tasks', edit.dataset.edit); if (t) openForm('task', t); return; }

    const note = e.target.closest('[data-note]');

      <p class="small muted">Kịch bản / quay / dựng được đếm theo mốc thời gian hoặc lịch sử chuyển giai đoạn. Một nội dung chỉ được đếm một lần cho mỗi mục.</p>
      <div class="grid cols-2" style="margin-top:10px">
        <div><h3 style="margin-bottom:6px">Theo nền tảng</h3>
          ${Object.entries(cs.byPlatform).length ? Object.entries(cs.byPlatform).map(([k, v]) => bar(k, v, Math.max(...Object.values(cs.byPlatform)))).join('') : '<p class="small muted">Chưa có nội dung đăng trong kỳ.</p>'}
        </div>
        <div><h3 style="margin-bottom:6px">Theo mục tiêu</h3>
          ${Object.entries(cs.byGoal).length ? Object.entries(cs.byGoal).map(([k, v]) => bar(k, v, Math.max(...Object.values(cs.byGoal)))).join('') : '<p class="small muted">Chưa có dữ liệu mục tiêu.</p>'}
        </div>
      </div>
    </div>
  </div>`;
}

function bar(label, value, max, suffix = '') {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return `<div class="hbar"><span class="lbl" title="${esc(label)}">${esc(label)}</span>
    <span class="track"><span style="width:${pct}%"></span></span>
    <span class="val">${esc(value)}${suffix}</span></div>`;
}

function timeSection(ts, tasks) {
  const expected = ts.byTask.reduce((n, row) => {
    const t = tasks.find(x => x.id === row.id);
    return n + (Number(t?.estimatedMin) || 0);
  }, 0);
  const groups = ts.byGroup.map(([g, m]) => [groupName(g), m]);
  const max = Math.max(1, ...groups.map(([, m]) => m));
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Báo cáo thời gian</h2><div class="spacer"></div>
      <button class="btn sm" data-csv="time">Xuất CSV</button></div>
    <div class="card-body">
      <div class="grid cols-3" style="margin-bottom:10px">
        <div class="card stat"><div class="label">Tổng đã ghi nhận</div><div class="value" style="font-size:22px">${esc(fmtDur(ts.total))}</div><div class="sub">${ts.count} phiên</div></div>
        <div class="card stat"><div class="label">Dự kiến của các việc có ghi giờ</div><div class="value" style="font-size:22px">${esc(fmtDur(expected))}</div></div>
        <div class="card stat"><div class="label">Chênh lệch</div><div class="value" style="font-size:22px">${expected ? ((ts.total / expected - 1) * 100).toFixed(0) + '%' : '—'}</div><div class="sub">Thực tế so với dự kiến</div></div>
      </div>
      ${groups.length ? groups.map(([l, m]) => `<div class="hbar"><span class="lbl" title="${esc(l)}">${esc(l)}</span>
        <span class="track"><span style="width:${Math.round((m / Math.max(1, ...groups.map(x => x[1]))) * 100)}%"></span></span>
        <span class="val">${esc(fmtDur(m))}</span></div>`).join('') : '<p class="small muted">Chưa có thời gian ghi nhận trong kỳ.</p>'}
      ${ts.byTask.length ? `<details class="section" style="margin-top:10px"><summary>Chi tiết theo công việc</summary>
        <div class="section-body table-wrap"><table class="table">
          <thead><tr><th>Công việc</th><th class="num">Thời gian</th><th class="num">Dự kiến</th></tr></thead>
          <tbody>${ts.byTask.map(r => {
            const t = tasks.find(x => x.id === r.id);
            return `<tr><td>${esc(r.title)}</td><td class="num">${esc(fmtDur(r.minutes))}</td>
              <td class="num">${esc(fmtDur(t?.estimatedMin))}</td></tr>`;
          }).join('')}</tbody></table></div></details>` : ''}
      <p class="small muted" style="margin-top:8px">Thời gian lấy từ các phiên làm việc và các lần nhập tay, không dùng trường ước lượng.</p>
    </div>
  </div>`;
}

function performanceSection(from, to) {
  const metrics = all('metrics').filter(m => inRange(m.date, from, to));
  if (!metrics.length) return '';
  const contents = new Map(all('contents').map(c => [c.id, c]));
  const rows = metrics.map(m => ({ m, c: contents.get(m.contentId) })).filter(x => x.c);
  const byPlatform = {};
  for (const { m, c } of rows) {
    const k = c.platform || 'Khác';
    const a = byPlatform[k] || { n: 0, views: 0, eng: 0, rate: 0, rn: 0 };
    a.n++;
    a.views += Number(m.views) || 0;
    a.eng += (m.likes || 0) + (m.comments || 0) + (m.shares || 0) + (m.saves || 0);
    const r = metricsRate(m);
    if (r !== null) { a.rate += r; a.rn++; }
    byPlatform[k] = a;
  }
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Hiệu quả nội dung trong kỳ</h2><div class="spacer"></div>
      <button class="btn sm" data-csv="metrics">Xuất CSV</button></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Nội dung</th><th>Nền tảng</th><th class="num">Ngày đo</th><th class="num">Xem</th><th class="num">Tương tác</th><th class="num">Tỷ lệ</th></tr></thead>
      <tbody>${rows.map(({ m, c }) => `<tr><td>${esc(c.title)}</td><td>${esc(c.platform || '—')}</td>
        <td class="num">${esc(fmtDate(m.date))}</td><td class="num">${Number(m.views || 0).toLocaleString('vi-VN')}</td>
        <td class="num">${((m.likes || 0) + (m.comments || 0) + (m.shares || 0) + (m.saves || 0)).toLocaleString('vi-VN')}</td>
        <td class="num">${metricsRate(m) === null ? '—' : metricsRate(m).toFixed(2) + '%'}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="card-body"><div class="grid cols-3">
      ${Object.entries(byPlatform).map(([k, a]) => `<div><h3>${esc(k)}</h3>
        <p class="small muted">${a.n} lần đo · ${a.views.toLocaleString('vi-VN')} lượt xem<br>
        Tỷ lệ tương tác TB: ${a.rn ? (a.rate / a.rn).toFixed(2) + '%' : '—'}</p></div>`).join('')}
    </div>
    <p class="small muted" style="margin-top:8px">Chỉ tổng hợp số liệu đã nhập. Không suy ra doanh thu/chuyển đổi khi chưa có dữ liệu nguồn.</p></div>
  </div>`;
}

function summarySection(stats, cs, ts) {
  const reasons = {};
  for (const t of stats.list) {
    if (t.delayReason) reasons[t.delayReason.trim()] = (reasons[t.delayReason.trim()] || 0) + 1;
  }
  const topReasons = Object.entries(reasons).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const suggestions = [];
  if (stats.overdue) suggestions.push(`Có ${stats.overdue} công việc quá hạn. Ưu tiên xử lý hoặc điều chỉnh deadline có ghi lý do.`);
  if (stats.total) {
    const adhocPct = Math.round((stats.adhoc / stats.total) * 100);
    if (adhocPct >= 30) suggestions.push(`Việc phát sinh/hỗ trợ chiếm ${adhocPct}% khối lượng — nên chừa 20–30% quỹ thời gian mỗi tuần.`);
  }
  if (cs.planned > cs.published) suggestions.push(`Kế hoạch đăng ${cs.planned} nội dung nhưng mới đăng ${cs.published}. Kiểm tra các mốc duyệt và lịch quay.`);
  if (cs.late) suggestions.push(`${cs.late} nội dung đăng trễ so với kế hoạch. Xem lại thời gian duyệt bản dựng.`);
  if (stats.ontimeRate !== null && stats.ontimeRate < 70) suggestions.push(`Tỷ lệ đúng hạn ${stats.ontimeRate.toFixed(0)}% — nên giảm số việc cam kết mỗi ngày hoặc tăng thời lượng dự kiến.`);
  if (!suggestions.length) suggestions.push('Không có dấu hiệu bất thường trong kỳ. Tiếp tục ghi nhận thời gian để báo cáo chính xác hơn.');

  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Tổng kết & đề xuất</h2><div class="spacer"></div>
      <button class="btn sm" data-csv="summary">Xuất CSV</button></div>
    <div class="card-body">
      <p><b>Đã hoàn thành ${stats.done} công việc, đăng ${cs.published} nội dung, ghi nhận ${esc(fmtDur(ts.total))}.</b></p>
      <p class="small">Còn ${stats.waiting + stats.onhold} việc đang chờ/tạm hoãn và ${stats.overdue} việc quá hạn.</p>
      <h3 style="margin-top:10px">Nguyên nhân chậm thường gặp</h3>
      ${topReasons.length ? `<ul class="small">${topReasons.map(([r, n]) => `<li>${esc(r)} — ${n} lần</li>`).join('')}</ul>`
        : '<p class="small muted">Chưa ghi nhận lý do trì hoãn. Thêm lý do khi chuyển việc để báo cáo có ích hơn.</p>'}
      <h3 style="margin-top:10px">Đề xuất điều chỉnh</h3>
      <ul class="small">${suggestions.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    </div>
  </div>`;
}

function render(view, params = {}) {
  applyParams(params);
  const { from, to, label } = range();
  const tasks = all('tasks');
  const contents = all('contents');
  const sessions = all('sessions');
  const stats = workStats(tasks, from, to);
  const cs = contentStats(contents, from, to);

  const ideasCount = all('ideas').filter(i => inRange(i.createdAt, from, to)).length;

  view.innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-body">
      <div class="row">
        <b>Kỳ báo cáo:</b>
        <div class="tabs" style="margin:0;border:0">

        </div>
        <span class="small muted">${esc(label)}</span>

        <button class="btn sm" data-apply-range>Áp dụng</button>
        ${state.custom ? '<button class="btn sm ghost" data-clear-range>Bỏ khoảng tuỳ chọn</button>' : ''}
      </div>
    </div></div>

    ${workSection(from, to, stats)}

      </div>
      <p class="small muted" style="margin:8px 0 0">File CSV dùng UTF-8 kèm BOM để Excel hiển thị đúng tiếng Việt.</p>
    </div></div>
  `;

  view.querySelectorAll('[data-period]').forEach(btn => btn.addEventListener('click', () => {
    state.period = btn.dataset.period;
    state.custom = false;
    render(view);
  }));
  view.querySelectorAll('[data-shift]').forEach(btn => btn.addEventListener('click', () => {
    const n = Number(btn.dataset.shift);
    if (state.period === 'day') state.ref = addDays(state.ref, n);
    else if (state.period === 'week') state.ref = addDays(state.ref, 7 * n);
    else {
      const d = new Date(`${state.ref}T00:00:00`);
      d.setMonth(d.getMonth() + n);
      state.ref = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    state.custom = false;
    render(view);
  }));

  view.querySelector('[data-apply-range]')?.addEventListener('click', () => {

    } else if (kind === 'contents') {

      csv('noi-dung', ['Tên', 'Nền tảng', 'Định dạng', 'Mục tiêu', 'Giai đoạn', 'Đăng dự kiến', 'Đăng thực tế', 'Link', 'Sản phẩm', 'Thương hiệu'], rows);
    } else if (kind === 'time') {
      const rows = sessions.filter(s => inRange(s.date || s.startedAt, from, to)).map(s => {
        const t = tasks.find(x => x.id === s.taskId);
        return [fmtDate(s.date), t?.title || '', s.minutes || 0, s.note || '', s.manual ? 'Nhập tay' : 'Bộ đếm', s.startedAt || '', s.endedAt || ''];
      });
      csv('thoi-gian', ['Ngày', 'Công việc', 'Số phút', 'Ghi chú', 'Nguồn', 'Bắt đầu', 'Kết thúc'], rows);
    } else if (kind === 'metrics') {
      const contentsMap = new Map(contents.map(c => [c.id, c]));
      const rows = all('metrics').filter(m => inRange(m.date, from, to)).map(m => {
        const c = contentsMap.get(m.contentId);
        return [c?.title || '(đã xoá)', c?.platform || m.platform || '', fmtDate(m.date), m.views || 0, m.reach || 0, m.likes || 0,
          m.comments || 0, m.shares || 0, m.saves || 0, m.completionRate || 0, m.clicks || 0, m.conversions || 0, m.notes || ''];
      });
      csv('hieu-qua', ['Nội dung', 'Nền tảng', 'Ngày đo', 'Xem', 'Tiếp cận', 'Thích', 'Bình luận', 'Chia sẻ', 'Lưu', 'Xem hết (%)', 'Nhấp', 'Chuyển đổi', 'Ghi chú'], rows);
    } else if (kind === 'summary') {
      const rows = [
        ['Kỳ báo cáo', label],
        ['Tổng công việc', stats.total],
        ['Hoàn thành', stats.done],
        ['Đang làm', stats.doing],
        ['Chờ / tạm hoãn', stats.waiting + stats.onhold],
        ['Quá hạn hiện tại', stats.overdue],
        ['Đúng hạn (%)', stats.ontimeRate === null ? '' : stats.ontimeRate.toFixed(1)],
        ['Mẫu số đúng hạn', stats.ontimeBase],
        ['Việc phát sinh', stats.adhoc],
        ['Đã huỷ', stats.cancelled],
        ['Ý tưởng ghi nhận', ideasCount],
        ['Kịch bản', cs.scripts],
        ['Đã quay', cs.shot],
        ['Đã dựng', cs.edited],
        ['Đã xuất bản', cs.published],
        ['Đăng trễ', cs.late],
        ['Thời gian ghi nhận (phút)', ts.total],
      ];
      csv('tong-ket', ['Chỉ số', 'Giá trị'], rows);
    }
  }));
}

return { render };
})();

function toCsv(headers, rows) {
  return '\ufeff' + [headers, ...rows].map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n\r;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\r\n');
}

      ? `<p>Phát hiện ${issues.length} liên kết trỏ tới bản ghi không còn tồn tại. Dữ liệu chính vẫn an toàn.</p>
        <ul class="small">${issues.slice(0, 30).map(([, , m]) => `<li>${esc(m)}</li>`).join('')}</ul>
        <div class="notice">Có thể gỡ các liên kết hỏng này. Không bản ghi nào bị xoá.</div>`
      : '<p>Không phát hiện liên kết hỏng. Dữ liệu nhất quán.</p>',
    actions: issues.length ? [
      {
        label: 'Gỡ liên kết hỏng', cls: 'primary', onClick: async (close) => {
          const { save, find } = await Promise.resolve(__M["js/store.js"]);
          try {
            const seen = new Set();
            for (const [store, id] of issues) {
              if (seen.has(`${store}:${id}`)) continue;
              seen.add(`${store}:${id}`);
              const rec = find(store, id);
              if (!rec) continue;
              const patch = store === 'metrics' ? { contentId: '' }
                : store === 'sessions' ? { taskId: '', contentId: '' }
                : { contentId: '', eventId: '', ideaId: '' };
              await save(store, { ...rec, ...patch });
            }
            close();
            toast('Đã gỡ các liên kết hỏng.', 'success');
          } catch (e) { toast('Không sửa được: ' + e.message, 'error'); }
        },
      },
      { label: 'Đóng', cls: 'ghost', onClick: c => c() },
    ] : [{ label: 'Đóng', cls: 'ghost', onClick: c => c() }],
  });
}

async function openPinDialog(role) {
  const A = window.__cwAuth;
  if (!A) { toast('Không khởi tạo được khoá ứng dụng.', 'error'); return; }
  const label = role === 'admin' ? 'admin' : 'viewer';
  openModal({
    title: `Đổi mật khẩu ${label}`,
    onMount: body => body.querySelector('#pin-old')?.focus(),
    content: `
      <div class="field"><label for="pin-old">Mật khẩu cũ</label>
        <input id="pin-old" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="4 chữ số"></div>
      <div class="field"><label for="pin-new">Mật khẩu mới</label>
        <input id="pin-new" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="4 chữ số"></div>
      <div class="field"><label for="pin-confirm">Nhập lại mật khẩu mới</label>
        <input id="pin-confirm" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="4 chữ số"></div>
      <p class="small muted">Mật khẩu được lưu dạng băm và đồng bộ lên Firebase để dùng trên mọi thiết bị. Không hiển thị lại mật khẩu.</p>`,
    actions: [
      { label: 'Hủy', cls: 'ghost', onClick: c => c() },
      {
        label: 'Đổi mật khẩu', cls: 'primary', onClick: async (close, wrap) => {
          const oldPin = wrap.querySelector('#pin-old').value.trim();
          const newPin = wrap.querySelector('#pin-new').value.trim();
          const again = wrap.querySelector('#pin-confirm').value.trim();
          if (!/^\d{4}$/.test(oldPin)) { toast('Mật khẩu cũ phải đúng 4 chữ số.', 'error'); return; }
          if (!/^\d{4}$/.test(newPin)) { toast('Mật khẩu mới phải đúng 4 chữ số.', 'error'); return; }
          if (newPin !== again) { toast('Mật khẩu mới nhập lại không khớp.', 'error'); return; }
          if (newPin === oldPin) { toast('Mật khẩu mới phải khác mật khẩu cũ.', 'error'); return; }
          if (!A.verify(role, oldPin)) { toast('Mật khẩu cũ không đúng.', 'error'); return; }
          const res = await A.setPin(role, newPin);
          close();
          toast(!res.configured
            ? 'Đã đổi mật khẩu trên máy này. Chưa cấu hình Firebase nên chưa đồng bộ.'
            : res.synced
              ? 'Đã đổi mật khẩu và đồng bộ lên Firebase.'
              : 'Đã đổi mật khẩu trên máy này. Sẽ tự đồng bộ khi có mạng.', res.synced ? 'success' : '');
        },
      },
    ],
  });
}

    });
  });

  view.querySelector('[data-add-group]').addEventListener('click', () => {
    openModal({
      title: 'Thêm nhóm công việc',
      content: '<div class="field"><label for="gn">Tên nhóm</label><input id="gn" type="text" placeholder="Ví dụ: Chạy quảng cáo"></div>',
      actions: [
        { label: 'Hủy', cls: 'ghost', onClick: c => c() },
        {
          label: 'Thêm', cls: 'primary', onClick: async (close, wrap) => {
            const name = wrap.querySelector('#gn').value.trim();
            if (!name) { toast('Nhập tên nhóm.', 'error'); return; }
            const id = 'g_' + Date.now().toString(36);
            await saveSettings({ groups: [...settings().groups, { id, name }] });
            close();
            toast('Đã thêm nhóm.', 'success');
            render(view);
          },
        },
      ],
    });
  });

  view.querySelector('[data-perm]').addEventListener('click', async () => {
    const p = await requestPermission();
    if (p === 'granted') {
      try { new Notification('Content Workspace', { body: 'Thông báo đã hoạt động trên trình duyệt này.' }); } catch { /* bỏ qua */ }
      toast('Đã cấp quyền thông báo.', 'success');
    } else if (p === 'denied') {
      toast('Quyền thông báo bị chặn. Cảnh báo trong ứng dụng vẫn hoạt động.', 'error');
    } else if (p === 'unsupported') {
      toast('Trình duyệt này không hỗ trợ thông báo.', 'error');
    } else {
      toast('Chưa cấp quyền thông báo. Cảnh báo trong ứng dụng vẫn hoạt động.');
    }
  });

  view.querySelectorAll('[data-change-pin]').forEach(btn => {
    btn.addEventListener('click', () => openPinDialog(btn.dataset.changePin));
  });

  const refreshCloud = () => {
    const box = view.querySelector('#cloud-card');
    if (box) box.innerHTML = cloudCardHtml();
  };
  unsubCloud?.();
  unsubCloud = subscribeCloud(refreshCloud);

  view.querySelector('[data-integrity]').addEventListener('click', openIntegrity);
  view.querySelector('[data-wipe]')?.addEventListener('click', () => wipeAll());

  // Lấy mật khẩu mới nhất từ Firebase để kiểm tra mật khẩu cũ chính xác.
  window.__cwAuth?.refresh?.().catch(() => {});
}

return { render };
})();

  events: '<path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.9 5.9 20.4l1.5-6.8L2.2 9l6.9-.7L12 2z"/>',
  reports: '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.42.5.72.95.85H21a2 2 0 1 1 0 4h-.09c-.45.13-.81.43-.95.85z"/>',
};
const MENU_ICON = '<path d="M4 7h16M4 12h16M4 17h16"/>';
const SUBTITLES = {
  dashboard: 'Bức tranh công việc hôm nay',
  tasks: 'Kế hoạch tháng, tuần và tiến độ',
  content: 'Từ ý tưởng đến lúc đăng bài',
  calendar: 'Lịch làm việc và các mốc quan trọng',
  ideas: 'Nơi lưu giữ và tái sử dụng ý tưởng',
  events: 'Sự kiện, lịch quay và việc hỗ trợ',
  reports: 'Số liệu để điều chỉnh kế hoạch',
  settings: 'Cá nhân hoá không gian làm việc',
};
const NAV_GROUPS = [
  { label: 'Không gian làm việc', routes: ['dashboard', 'tasks', 'content', 'calendar'] },
  { label: 'Sáng tạo', routes: ['ideas', 'events'] },
  { label: 'Theo dõi', routes: ['reports', 'settings'] },
];
const MOBILE_ROUTES = ['dashboard', 'tasks', 'content', 'calendar'];
const MOBILE_LABELS = { dashboard: 'Tổng quan', tasks: 'Việc', content: 'Nội dung', calendar: 'Lịch' };

const $ = s => document.querySelector(s);

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const [path, qs] = raw.split('?');
  const route = ROUTES[path] ? path : 'dashboard';
  const params = {};
  for (const [k, v] of new URLSearchParams(qs || '')) params[k] = v;
  return { route, params };
}

function applyTheme() {
  document.documentElement.dataset.theme = settings().theme === 'dark' ? 'dark' : 'light';
}

function navItem(route) {
  return `<a href="#/${route}" data-route="${route}" title="${TITLES[route]}">
    <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[route]}</svg>
    <span>${TITLES[route]}</span>
    <span class="count" data-count="${route}"></span>
  </a>`;
}

function buildNav() {
  $('#nav').innerHTML = NAV_GROUPS.map(group => `
    <div class="nav-group">
      <span class="nav-label">${group.label}</span>
      ${group.routes.map(navItem).join('')}
    </div>`).join('');

  const bottom = $('#bottom-nav');
  if (bottom) {
    bottom.innerHTML = MOBILE_ROUTES.map(route => `
      <a href="#/${route}" data-route="${route}" class="bottom-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[route]}</svg>
        <span>${MOBILE_LABELS[route]}</span>
      </a>`).join('') + `
      <button type="button" class="bottom-item" id="bottom-menu" aria-label="Mở menu đầy đủ">
        <svg viewBox="0 0 24 24" aria-hidden="true">${MENU_ICON}</svg>
        <span>Menu</span>
      </button>`;
  }
  updateCounts();
}

function updateCounts() {
  const counts = {
    tasks: all('tasks').filter(t => ['todo', 'doing', 'waiting', 'onhold'].includes(t.status)).length,
    content: all('contents').filter(c => !['published', 'measuring', 'completed', 'cancelled'].includes(c.stage)).length,
    ideas: all('ideas').filter(i => ['new', 'considering'].includes(i.status)).length,
    events: all('events').length,
  };
  for (const [k, v] of Object.entries(counts)) {
    const el = document.querySelector(`[data-count="${k}"]`);
    if (el) el.textContent = v ? String(v) : '';
  }
}

let currentRoute = 'dashboard';
let renderQueued = false;

function renderRoute(preserveScroll = false) {
  const y = window.scrollY;
  const { route, params } = parseHash();
  const prevRoute = currentRoute;
  currentRoute = route;

  const old = document.getElementById('view');
  const view = document.createElement('main');
  view.id = 'view';
  view.tabIndex = -1;
  old.replaceWith(view);

  try {
    ROUTES[route].render(view, params);
  } catch (e) {
    console.error(e);
    view.innerHTML = `<div class="notice bad">Không hiển thị được màn hình: ${esc(e.message)}</div>`;
    toast('Có lỗi khi hiển thị màn hình.', 'error');
  }

  $('#page-title').textContent = TITLES[route];
  document.body.dataset.route = route;
  const subtitle = $('#page-subtitle');
  if (subtitle) subtitle.textContent = SUBTITLES[route] || '';
  document.title = `${TITLES[route]} · Content Workspace`;
  document.querySelectorAll('#nav a').forEach(a => {
    const on = a.dataset.route === route;
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  document.querySelectorAll('#bottom-nav [data-route]').forEach(a => {
    const on = a.dataset.route === route;
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  $('#bottom-menu')?.classList.toggle('active', !MOBILE_ROUTES.includes(route));
  updateCounts();
  renderBell();
  renderTimer();
  if (preserveScroll && prevRoute === route) window.scrollTo(0, y);
  else if (prevRoute !== route) window.scrollTo(0, 0);
}

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    renderRoute(true);
  });
}

// ---------- bộ đếm thời gian ----------
function renderTimer() {
  const el = $('#timer-widget');
  if (!el) return;
  const t = timer.activeTimer();
  if (!t) {
    el.innerHTML = '<div class="timer-idle">Chưa chạy bộ đếm thời gian</div>';
    return;
  }
  const task = find('tasks', t.taskId);
  const running = isRunning(t);
  el.innerHTML = `<div class="timer-widget">
    <div class="small muted">${running ? '<span class="timer-live">Đang tính giờ</span>' : 'Tạm dừng'}</div>
    <div class="timer-time">${timer.clockLabel(t)}</div>
    <div class="small" title="${esc(task?.title || '')}">${esc((task?.title || 'Công việc đã xoá').slice(0, 40))}</div>
    <div class="row" style="margin-top:7px">
      <button class="btn sm" data-timer-toggle>${running ? 'Tạm dừng' : 'Tiếp tục'}</button>
      <button class="btn sm primary" data-timer-stop>Kết thúc</button>
    </div>
  </div>`;
}

// ---------- thông báo ----------
let lastAlerts = [];
function renderBell() {
  lastAlerts = currentAlerts();
  const badge = $('#bell-count');
  if (!badge) return;
  badge.hidden = !lastAlerts.length;
  badge.textContent = lastAlerts.length > 99 ? '99+' : String(lastAlerts.length);
  const pop = $('#bell-pop');
  pop.innerHTML = `<div class="pop-head">Cảnh báo (${lastAlerts.length})</div>
    ${lastAlerts.length ? lastAlerts.slice(0, 20).map((a, i) => `
      <button type="button" class="alert-row ${a.kind}" data-alert-index="${i}">
        <span class="dot"></span>
        <span><b style="font-weight:600">${esc(a.title)}</b><br><span class="small muted">${esc(a.text)}</span></span>
      </button>`).join('')
      : '<div class="empty" style="padding:20px"><strong>Không có cảnh báo</strong><span>Deadline và tiến độ đang ổn.</span></div>'}
    <div style="padding:6px"><button type="button" class="btn sm ghost" data-bell-settings style="width:100%">Cài đặt thông báo</button></div>`;
}

function openAlert(a) {
  if (!a) return;
  const map = { tasks: ['task', 'tasks'], content: ['content', 'contents'], events: ['event', 'events'] };
  const [entity, storeName] = map[a.route] || [];
  if (!entity) return;
  const rec = find(storeName, a.id);
  if (!rec) { toast('Bản ghi không còn tồn tại.', 'error'); return; }
  $('#bell-pop').hidden = true;
  openForm(entity, rec);
}

// ---------- tìm kiếm ----------
const searchIndex = () => {
  const out = [];
  for (const p of all('projects')) out.push({ type: 'project', label: 'Công việc lớn', rec: p, hay: [p.title, p.description, p.notes].join(' ') });
  for (const t of all('tasks')) out.push({ type: 'task', label: 'Công việc', rec: t, hay: [t.title, t.description, t.project, find('projects', t.projectId)?.title || '', ...(t.tags || [])].join(' ') });
  for (const c of all('contents')) out.push({ type: 'content', label: 'Nội dung', rec: c, hay: [c.title, c.code, c.topic, c.hook, c.insight, c.product, c.brand, c.script].join(' ') });
  for (const i of all('ideas')) out.push({ type: 'idea', label: 'Ý tưởng', rec: i, hay: [i.title, i.topic, i.description, i.hook, i.insight, ...(i.tags || [])].join(' ') });
  for (const e of all('events')) out.push({ type: 'event', label: 'Sự kiện', rec: e, hay: [e.title, e.location, e.organizer, e.role].join(' ') });
  for (const r of all('resources')) out.push({ type: 'resource', label: 'Tài nguyên', rec: r, hay: [r.title, r.description, r.body, r.brand, ...(r.keywords || [])].join(' ') });
  return out;
};

let searchTimer = null;
function runSearch(q) {
  clearTimeout(searchTimer);
  const box = $('#search-results');
  if (!norm(q)) { box.hidden = true; box.innerHTML = ''; return; }
  searchTimer = setTimeout(() => {
    const results = searchIndex().filter(x => searchMatch(x.hay, q)).slice(0, 12);
    box.innerHTML = results.length
      ? results.map((r, i) => `<button type="button" data-result="${i}">
          <b style="font-weight:600">${esc(r.rec.title)}</b>
          <span class="small muted"> · ${r.label}${r.rec.due ? ' · ' + fmtDate(r.rec.due) : ''}${r.rec.platform ? ' · ' + esc(r.rec.platform) : ''}</span>
        </button>`).join('')
      : '<div class="pop-head">Không có kết quả</div>';
    box.dataset.results = JSON.stringify(results.map(r => ({ type: r.type, id: r.rec.id })));
    box.hidden = false;
  }, 140);
}

// ---------- thêm nhanh ----------
function quickMenu() {
  const pop = $('#menu-pop');
  pop.innerHTML = `
    <button type="button" data-quick="task">Công việc mới</button>
    <button type="button" data-quick="adhoc">Việc phát sinh</button>
    <button type="button" data-quick="idea">Ý tưởng</button>
    <button type="button" data-quick="content">Nội dung mới</button>
    <button type="button" data-quick="event">Sự kiện</button>
    <button type="button" data-quick="time">Ghi nhận thời gian</button>
    <button type="button" data-quick="note">Ghi chú phát sinh</button>`;
}

function handleQuick(kind) {
  $('#menu-pop').hidden = true;
  if (kind === 'task') openForm('task', null);
  else if (kind === 'adhoc') openForm('task', { ...blank('task'), source: 'adhoc', receivedAt: today(), priority: 'high' });
  else if (kind === 'idea') openForm('idea', null);
  else if (kind === 'content') openForm('content', null);
  else if (kind === 'event') openForm('event', null);
  else if (kind === 'time') openForm('session', { ...blank('session'), date: today(), minutes: 30 });
  else if (kind === 'note') {
    openModal({
      title: 'Ghi chú phát sinh',
      content: `<div class="field"><label for="nt">Tiêu đề ngắn</label><input id="nt" type="text" placeholder="Ví dụ: khách đổi brief chiến dịch"></div>
        <div class="field"><label for="nc">Nội dung ghi chú</label><textarea id="nc" rows="4"></textarea></div>
        <p class="small muted">Ghi chú được lưu thành một công việc trong nhóm Hành chính, nguồn "Phát sinh".</p>`,
      actions: [
        { label: 'Hủy', cls: 'ghost', onClick: c => c() },
        {
          label: 'Lưu ghi chú', cls: 'primary', onClick: async (close, wrap) => {
            const title = wrap.querySelector('#nt').value.trim();
            const body = wrap.querySelector('#nc').value.trim();
            if (!title && !body) { toast('Chưa nhập nội dung.', 'error'); return; }
            try {
              await store.save('tasks', {
                ...blank('task'), id: '', title: title || 'Ghi chú phát sinh', groupId: 'admin',
                source: 'adhoc', receivedAt: today(), notes: body, priority: 'medium', status: 'todo',
              });
              close();
              toast('Đã lưu ghi chú phát sinh.', 'success');
            } catch (e) { toast('Không lưu được: ' + e.message, 'error'); }
          },
        },
      ],
    });
  }
}

// ---------- khung ----------
function bindShell() {
  window.addEventListener('cw-readonly', () => toast('Chế độ chỉ xem: không thể sửa dữ liệu.', 'error'));
  $('#today-label').textContent = `${['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'][new Date().getDay()]}, ${fmtDate(today())}`;

  const syncNote = $('#sync-note');
  const syncLabel = $('#sync-label');
  const renderSync = () => {
    if (!syncNote || !syncLabel) return;
    const c = cloudState();
    syncNote.dataset.state = c.configured ? c.status : 'off';
    syncLabel.textContent = cloudLabel(c);
    syncNote.title = cloudStatusText(c);
  };
  subscribeCloud(renderSync);
  renderSync();

  const isMobileNav = () => window.matchMedia('(max-width: 900px)').matches;
  const closeDrawer = () => {
    $('#sidebar').classList.remove('open');
    $('#scrim').hidden = true;
  };
  const openDrawer = () => {
    $('#sidebar').classList.add('open');
    $('#scrim').hidden = false;
  };

  $('#menu-btn').addEventListener('click', () => {
    if (isMobileNav()) { openDrawer(); return; }
    const app = document.querySelector('.app');
    app.classList.toggle('sidebar-collapsed');
    try { localStorage.setItem('cw-sidebar-collapsed', app.classList.contains('sidebar-collapsed') ? '1' : '0'); } catch { /* trình duyệt chặn */ }
  });
  $('#scrim').addEventListener('click', closeDrawer);
  $('#bottom-menu')?.addEventListener('click', openDrawer);
  $('#sidebar').addEventListener('click', e => {
    if (e.target.closest('a[data-route]') && isMobileNav()) closeDrawer();
  });

  $('#btn-quick').addEventListener('click', e => {
    e.stopPropagation();
    quickMenu();
    const pop = $('#menu-pop');
    pop.hidden = !pop.hidden;
    $('#bell-pop').hidden = true;
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#menu-pop') && !e.target.closest('#btn-quick')) $('#menu-pop').hidden = true;
    if (!e.target.closest('#bell-pop') && !e.target.closest('#btn-bell')) $('#bell-pop').hidden = true;
    if (!e.target.closest('#search-results') && !e.target.closest('#global-search')) $('#search-results').hidden = true;
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
      e.preventDefault();
      $('#global-search').focus();
      $('#global-search').select();
      return;
    }
    if (e.key === 'Escape') {
      $('#menu-pop').hidden = true;
      $('#bell-pop').hidden = true;
      $('#search-results').hidden = true;
      closeDrawer();
    }
  });

  $('#menu-pop').addEventListener('click', e => {
    const b = e.target.closest('[data-quick]');
    if (b) handleQuick(b.dataset.quick);
  });

  $('#btn-bell').addEventListener('click', e => {
    e.stopPropagation();
    renderBell();
    $('#bell-pop').hidden = !$('#bell-pop').hidden;
    $('#menu-pop').hidden = true;
  });

  $('#bell-pop').addEventListener('click', e => {
    const s = e.target.closest('[data-bell-settings]');
    if (s) { $('#bell-pop').hidden = true; location.hash = '#/settings'; return; }
    const row = e.target.closest('[data-alert-index]');
    if (row) openAlert(lastAlerts[Number(row.dataset.alertIndex)]);
  });

  $('#global-search').addEventListener('input', e => runSearch(e.target.value));
  $('#global-search').addEventListener('focus', e => { if (e.target.value) runSearch(e.target.value); });
  $('#global-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      $('#search-results').hidden = true;
      if (q) location.hash = `#/tasks?q=${encodeURIComponent(q)}`;
    }
  });
  $('#search-results').addEventListener('click', e => {
    const b = e.target.closest('[data-result]');
    if (!b) return;
    const list = JSON.parse($('#search-results').dataset.results || '[]');
    const item = list[Number(b.dataset.result)];
    $('#search-results').hidden = true;
    $('#global-search').value = '';
    if (item) {
      const storeName = item.type === 'task' ? 'tasks' : item.type === 'project' ? 'projects'
        : item.type === 'content' ? 'contents' : item.type === 'idea' ? 'ideas'
        : item.type === 'event' ? 'events' : 'resources';
      const rec = find(storeName, item.id);
      if (rec) openForm(item.type, rec);
    }
  });

  $('#timer-widget').addEventListener('click', async e => {
    const t = timer.activeTimer();
    if (!t) return;
    if (e.target.closest('[data-timer-toggle]')) {
      if (isRunning(t)) await timer.pause(); else await timer.resume();
      renderTimer();
    }
    if (e.target.closest('[data-timer-stop]')) {
      const task = find('tasks', t.taskId);
      const ok = await confirmDialog({
        title: 'Kết thúc bộ đếm',
        message: `Ghi nhận ${timer.clockLabel(t)} cho "${task?.title || 'công việc'}"?`,
        okLabel: 'Kết thúc và lưu',
      });
      if (!ok) return;
      const r = await timer.stop();
      if (r) toast(`Đã ghi nhận ${fmtDur(r.minutes)}.`, 'success');
      renderTimer();
    }
  });

  window.addEventListener('hashchange', () => {
    if (parseHash().route !== currentRoute) {
      $('#sidebar').classList.remove('open');
      $('#scrim').hidden = true;
    }
    renderRoute(false);
  });

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window.__deferredPrompt = e;
  });
}

async function boot() {
  if (window.__cwReady) await window.__cwReady;
  try {
    await store.init();
  } catch (e) {
    console.error(e);
    document.getElementById('view').innerHTML = `<div class="notice bad">Không mở được cơ sở dữ liệu trên trình duyệt này. Hãy dùng Chrome, Edge, Firefox hoặc Safari phiên bản mới và không mở ở chế độ ẩn danh.<br><span class="small">${esc(e.message)}</span><div style="margin-top:10px"><button class="btn" onclick="location.reload()">Tải lại trang</button></div></div>`;
    return;
  }

  applyTheme();
  buildNav();
  bindShell();
  try {
    if (localStorage.getItem('cw-sidebar-collapsed') === '1' && !window.matchMedia('(max-width: 900px)').matches) {
      document.querySelector('.app').classList.add('sidebar-collapsed');
    }
  } catch { /* trình duyệt chặn localStorage */ }
  if (!location.hash) location.hash = '#/dashboard';

  // Chuyển dự án cũ + đồng bộ tiến độ công việc lớn trước lần vẽ đầu tiên.
  try { await projects.init(); } catch (e) { console.warn('projects:', e); }

  store.subscribe((type) => {
    updateCounts();
    if (type === 'timer') renderTimer();
    scheduleRender();
  });

  renderRoute(false);
  renderTimer();
  setInterval(renderTimer, 1000);

  // Thông báo nền chỉ khi đã có quyền; không tự xin quyền khi mở app.
  setTimeout(() => {
    try { sendDailyDigest(); } catch (e) { console.warn(e); }
  }, 2500);

  // Firebase là tùy chọn: chưa điền FIREBASE_CONFIG thì không tải SDK.
  initCloud().catch(e => console.warn('Firebase:', e));
}

boot();

return {  };
})();

</script>
