<head>

<title>Content Workspace — Quản lý công việc Content Marketing</title>
<meta name="description" content="Quản lý công việc, sản xuất nội dung, lịch, thời gian và báo cáo cho người làm Content Marketing.">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3ECW%3C/text%3E%3C/svg%3E">
<style>
/* Content Workspace — giao diện */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --text: #1b2230;
  --muted: #667085;
  --line: #e3e6ec;
  --accent: #2563eb;
  --accent-soft: #e8efff;
  --good: #15803d;
  --good-soft: #e6f6ec;
  --warn: #b45309;
  --warn-soft: #fdf3e2;
  --bad: #b42318;
  --bad-soft: #fdeceb;
  --info: #0f6b8a;
  --info-soft: #e5f4f9;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px rgba(16, 24, 40, .06);
  --sidebar: 248px;
}
html[data-theme="dark"] {
  --bg: #0f1319;
  --surface: #171c24;
  --surface-2: #1f2632;
  --text: #e6eaf0;
  --muted: #93a0b4;
  --line: #2a3341;
  --accent: #6ea2ff;
  --accent-soft: #1b2a45;
  --good: #6ee7a0;
  --good-soft: #14281e;
  --warn: #f7c265;
  --warn-soft: #2c2415;
  --bad: #ff9288;
  --bad-soft: #2e1a18;
  --info: #7fd1e8;
  --info-soft: #10262c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
h1 { font-size: 20px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* ---------- layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar); flex: 0 0 var(--sidebar); background: var(--surface);
  border-right: 1px solid var(--line); padding: 18px 14px;
  display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; background: var(--accent);
  color: #fff; display: grid; place-items: center; font-weight: 700; letter-spacing: .02em;
}
.brand strong { display: block; font-size: 14px; }
.brand span { display: block; font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
  color: var(--text); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: 0 0 18px; }
.nav .count { margin-left: auto; font-size: 11px; color: var(--muted); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 14px 22px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { flex: 0 0 auto; }
.search-wrap { position: relative; flex: 1; max-width: 420px; margin-left: 8px; }
.search-wrap input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg); color: var(--text); font: inherit;
}
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
#view { padding: 22px; max-width: 1400px; width: 100%; outline: none; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 550;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.icon-btn {
  position: relative; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font-size: 15px; cursor: pointer;
  display: inline-grid; place-items: center;
}
.icon-btn:hover { background: var(--surface-2); }
.badge {
  position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700;
  display: grid; place-items: center;
}
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
}
input[type="checkbox"], input[type="radio"] { width: auto; }
input:focus, select:focus, textarea:focus, .btn:focus-visible, .nav a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
textarea { resize: vertical; min-height: 70px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters input, .filters select { width: auto; min-width: 130px; }
.filters input[type="checkbox"], .filters input[type="radio"] { width: auto; min-width: 0; }
.filters .search { min-width: 220px; flex: 1; max-width: 340px; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card-head {
  display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line);
}
.card-head h2 { font-size: 14px; }
.card-head .spacer { flex: 1; }
.card-body { padding: 16px; }
.card-body.tight { padding: 0; }
.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stat { padding: 14px 16px; }
.stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat .value { font-size: 26px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; }
.stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stat.alert .value { color: var(--bad); }
.stat a { text-decoration: none; color: inherit; }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--surface-2); }
.table tbody tr:hover { background: var(--surface-2); }
.table tr.clickable { cursor: pointer; }
.table td.num, .table th.num { text-align: right; white-space: nowrap; }
.table .title { font-weight: 550; }
.pager { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }

/* ---------- pills / chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--muted);
}
.pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.green { background: var(--good-soft); color: var(--good); }
.pill.amber { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--bad-soft); color: var(--bad); }
.pill.teal { background: var(--info-soft); color: var(--info); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; color: var(--muted); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px;
  font: inherit; font-weight: 550; color: var(--muted); cursor: pointer; white-space: nowrap;
}
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--text); }

/* ---------- kanban ---------- */
.kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
.kanban-col { flex: 0 0 250px; background: var(--surface-2); border-radius: 10px; padding: 8px; min-height: 80px; }
.kanban-col.drag-over { outline: 2px dashed var(--accent); }
.kanban-col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); display: flex; gap: 6px; padding: 2px 4px 8px; }
.kanban-col h3 .count { margin-left: auto; }
.kcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px;
  margin-bottom: 8px; cursor: grab; box-shadow: 0 1px 1px rgba(16,24,40,.03);
}
.kcard:active { cursor: grabbing; }
.kcard.dragging { opacity: .45; }
.kcard .name { font-weight: 550; font-size: 13px; margin-bottom: 5px; }
.kcard .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11px; color: var(--muted); }
.kcard select { width: 100%; margin-top: 7px; font-size: 11px; padding: 3px 5px; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-head .title { font-weight: 650; font-size: 15px; min-width: 150px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.cal-dow { padding: 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; background: var(--surface-2); text-transform: uppercase; letter-spacing: .04em; }
.cal-cell { min-height: 96px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); padding: 5px; font-size: 12px; position: relative; }
.cal-cell:nth-child(7n) { border-right: 0; }
.cal-cell.out { background: var(--bg); color: var(--muted); }
.cal-cell.today { background: var(--accent-soft); }
.cal-cell .daynum { font-weight: 600; font-size: 12px; margin-bottom: 3px; }
.cal-item {
  display: block; font-size: 11px; padding: 2px 5px; border-radius: 5px; margin-bottom: 3px;
  border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; text-decoration: none;
}
.cal-item.task { border-color: #8b5cf6; background: #f1ecfe; }
html[data-theme="dark"] .cal-item.task { background: #241c3d; }
.cal-item.content { border-color: #0ea5e9; background: #e6f5fc; }
html[data-theme="dark"] .cal-item.content { background: #10262e; }
.cal-item.event { border-color: #f59e0b; background: #fdf3e2; }
html[data-theme="dark"] .cal-item.event { background: #2c2415; }
.cal-item.overdue { border-color: var(--bad); background: var(--bad-soft); }
.cal-day-list .cal-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.cal-day-list .time { flex: 0 0 52px; color: var(--muted); font-size: 12px; padding-top: 1px; }

/* ---------- modal ---------- */
.modal-wrap {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex;
  align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 620px; max-width: 100%;
  display: flex; flex-direction: column; max-height: calc(100vh - 80px);
}
.modal.wide { width: 900px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { flex: 1; font-size: 15px; }
.modal-body { padding: 18px; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 11px; color: var(--muted); }
.field.full { grid-column: 1 / -1; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--bad); }
.field .err { font-size: 11px; color: var(--bad); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
details.section { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
details.section > summary {
  cursor: pointer; padding: 10px 12px; font-weight: 600; font-size: 13px; list-style: none;
  display: flex; align-items: center; gap: 6px;
}
details.section > summary::before { content: "▸"; color: var(--muted); }
details.section[open] > summary::before { content: "▾"; }
details.section > .section-body { padding: 4px 12px 8px; }
.cl-item { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.cl-item input[type="text"] { flex: 1; }
.cl-item input[type="checkbox"] { flex: 0 0 auto; }
.weekdays { display: flex; gap: 6px; flex-wrap: wrap; }
.weekdays label { font-size: 12px; border: 1px solid var(--line); border-radius: 7px; padding: 3px 7px; }

/* ---------- popovers ---------- */
.pop {
  position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); z-index: 60; min-width: 200px; padding: 6px; max-height: 70vh; overflow-y: auto;
}
.search-results { left: 0; right: 0; top: 40px; }
.pop button, .pop a.item {
  display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 7px;
  padding: 8px 10px; font: inherit; color: var(--text); cursor: pointer; text-decoration: none;
}
.pop button:hover, .pop a.item:hover { background: var(--surface-2); }
.pop .pop-head { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 10px 4px; }
#menu-pop { top: 58px; right: 90px; }
#bell-pop { top: 58px; right: 14px; width: 380px; }
.alert-row { display: flex; gap: 8px; padding: 8px 10px; border-radius: 8px; align-items: flex-start; cursor: pointer; }
.alert-row:hover { background: var(--surface-2); }
.alert-row .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: 0 0 8px; background: var(--warn); }
.alert-row.bad .dot { background: var(--bad); }
.alert-row.info .dot { background: var(--accent); }

/* ---------- toast ---------- */
#toast-root { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 9px; font-size: 13px;
  box-shadow: var(--shadow); max-width: 340px; animation: slidein .18s ease-out;
}
.toast.error { background: var(--bad); color: #fff; }
.toast.success { background: var(--good); color: #fff; }
@keyframes slidein { from { transform: translateY(8px); opacity: 0; } }

/* ---------- misc ---------- */
.bar { height: 8px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.bar.green > span { background: var(--good); }
.hbar { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
.hbar .lbl { flex: 0 0 150px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.hbar .track span { display: block; height: 100%; background: var(--accent); }
.hbar .val { flex: 0 0 64px; text-align: right; font-variant-numeric: tabular-nums; }
.goal { margin-bottom: 12px; }
.goal .row { font-size: 12px; margin-bottom: 4px; }
.timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 12px; }
.timeline div { font-size: 12px; margin-bottom: 6px; color: var(--muted); }
.timeline b { color: var(--text); font-weight: 550; }
.detail-list { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; font-size: 13px; }
.detail-list dt { color: var(--muted); font-size: 12px; }
.detail-list dd { margin: 0; word-break: break-word; }
.chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: 8px; }
.chart-bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; }
.chart-bars .col .fill { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart-bars .col .cap { font-size: 10px; color: var(--muted); white-space: nowrap; }
.notice { padding: 10px 12px; border-radius: 9px; font-size: 12px; background: var(--warn-soft); color: var(--warn); margin-bottom: 12px; }
.notice.info { background: var(--info-soft); color: var(--info); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.scrim { display: none; }
.scrim[hidden] { display: none !important; }

@media (max-width: 1100px) { .cols-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  :root { --sidebar: 232px; }
  .sidebar { position: fixed; left: 0; top: 0; z-index: 80; transform: translateX(-105%); transition: transform .18s ease; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 70; }
  .mobile-only { display: inline-grid !important; }
  .topbar { padding: 12px 14px; flex-wrap: wrap; }
  .search-wrap { order: 5; flex: 1 1 100%; max-width: none; margin-left: 0; }
  #view { padding: 14px; }
  .cols-3, .cols-2 { grid-template-columns: 1fr; }
  .detail-list { grid-template-columns: 1fr; }
  .detail-list dt { margin-top: 6px; }
  #today-label { display: none; }
  .modal-wrap { padding: 0; align-items: flex-end; }
  .modal { max-height: 94vh; border-radius: 14px 14px 0 0; }
  .form-grid { grid-template-columns: 1fr; }
  .cal-cell { min-height: 68px; padding: 3px; }
  .cal-item { font-size: 10px; padding: 1px 3px; }
  table.table { min-width: 720px; }
  table.tasks-table { min-width: 0; }
  .tasks-table th:nth-child(3), .tasks-table td:nth-child(3),
  .tasks-table th:nth-child(4), .tasks-table td:nth-child(4),
  .tasks-table th:nth-child(5), .tasks-table td:nth-child(5),
  .tasks-table th:nth-child(7), .tasks-table td:nth-child(7),
  .tasks-table th:nth-child(8), .tasks-table td:nth-child(8) { display: none; }
}
@media (max-width: 560px) {
  .cols-5, .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat .value { font-size: 22px; }
  .topbar h1 { font-size: 16px; }
  #btn-quick { padding: 7px 10px; }
  .kanban-col { flex-basis: 220px; }
  #bell-pop { width: calc(100vw - 20px); right: 10px; }
  .tabs, .kanban { scrollbar-width: none; }
  .tabs::-webkit-scrollbar, .kanban::-webkit-scrollbar { display: none; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
  .filters .search { grid-column: 1 / -1; max-width: none; min-width: 0; }
  .filters input, .filters select { width: 100%; min-width: 0; }

<script>
(function () {
  const cfg = window.APP_LOCK || {};
  const saved = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const admin = saved('cw-pin-admin') || String(cfg.adminPin || '');
  const viewer = saved('cw-pin-viewer') || String(cfg.viewerPin || '');
  const box = document.getElementById('lock');
  let done = false;
  let resolveReady;
  window.__cwReady = new Promise(r => { resolveReady = r; });
  const finish = role => {
    if (done) return;
    done = true;
    window.__CW_ROLE = role;
    document.body.classList.add(role === 'viewer' ? 'role-viewer' : 'role-admin');
    document.getElementById('viewer-banner').hidden = role !== 'viewer';
    box.hidden = true;
    resolveReady();
  };
  if (!/^\d{4}$/.test(admin) && !/^\d{4}$/.test(viewer)) { finish('admin'); return; }
  box.hidden = false;
  const err = document.getElementById('lock-error');
  const dotsBox = document.getElementById('lock-dots');
  const dots = [...dotsBox.querySelectorAll('span')];
  let pin = '';
  const render = () => {
    dots.forEach((d, i) => d.classList.toggle('on', i < pin.length));
    dotsBox.setAttribute('aria-label', `Đã nhập ${pin.length} trên 4 số`);
  };
  const submit = () => {
    if (admin && pin === admin) { finish('admin'); return; }
    if (viewer && pin === viewer) { finish('viewer'); return; }
    err.textContent = 'Sai mật khẩu. Thử lại.';
    pin = '';
    render();
  };
  const press = key => {
    if (done) return;
    err.textContent = '';
    if (key === 'del') { pin = pin.slice(0, -1); render(); return; }
    if (key === 'ok') { if (pin.length === 4) submit(); return; }
    if (pin.length >= 4) return;
    pin += key;
    render();
    if (pin.length === 4) submit();
  };
  render();
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-key]');
    if (b) press(b.dataset.key);
  });
  document.addEventListener('keydown', e => {
    if (done) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
    else if (e.key === 'Enter') { e.preventDefault(); press('ok'); }
  });
})();
</script>

__M["js/db.js"] = (() => {
// Lớp truy cập IndexedDB. Không phụ thuộc giao diện — có thể thay bằng API sau này.
const DB_NAME = 'content-manager';
const DB_VERSION = 1;
const STORES = ['tasks', 'contents', 'ideas', 'resources', 'events', 'metrics', 'sessions', 'settings', 'timer'];

let dbPromise = null;

function open() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const name of STORES) {
        if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Không mở được cơ sở dữ liệu.'));
    req.onblocked = () => reject(new Error('Cơ sở dữ liệu đang bị một tab khác giữ. Hãy đóng tab đó và thử lại.'));
  });
  return dbPromise;
}

async function run(storeName, mode, fn) {
  const db = await open();
  return new Promise((resolve, reject) => {
    let result;
    const t = db.transaction(storeName, mode);
    const store = t.objectStore(storeName);
    result = fn(store);
    t.oncomplete = () => resolve(result && result.result !== undefined ? result.result : result);
    t.onerror = () => reject(t.error || new Error('Lỗi cơ sở dữ liệu.'));
    t.onabort = () => reject(t.error || new Error('Giao dịch bị hủy.'));
  });
}

async function getAll(storeName) {
  return run(storeName, 'readonly', store => store.getAll());
}

async function get(storeName, id) {
  return run(storeName, 'readonly', store => store.get(id));
}

async function put(storeName, record) {
  await run(storeName, 'readwrite', store => store.put(record));
  return record;
}

async function putMany(storeName, records) {
  if (!records.length) return;
  await run(storeName, 'readwrite', store => { records.forEach(r => store.put(r)); });
}

async function del(storeName, id) {
  await run(storeName, 'readwrite', store => store.delete(id));
}

async function clear(storeName) {
  await run(storeName, 'readwrite', store => store.clear());
}

return { STORES, getAll, get, put, putMany, del, clear };
})();

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);

function parseYmd(s) {
  if (!s) return null;
  const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  const date = new Date(y, m - 1, d);
  return Number.isNaN(date.getTime()) ? null : date;
}

const fmtDate = s => (s ? String(s).slice(0, 10).split('-').reverse().join('/') : '');

function fmtDateTime(s) {
  if (!s) return '';
  const d = new Date(s);
  if (Number.isNaN(d.getTime())) return esc(s);
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function diffDays(a, b) {

  return Math.round((da - db) / 864e5);
}

const WD = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const weekdayName = s => { const d = parseYmd(s); return d ? WD[d.getDay()] : ''; };
const WD_SHORT = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

// weekStart: 0/7 = Chủ Nhật, 1 = Thứ Hai ... 6 = Thứ Bảy
function startOfWeek(s, weekStart = 1) {
  const d = parseYmd(s) || new Date();
  const dow = d.getDay() || 7; // 1..7
  const ws = Number(weekStart);
  const start = ws === 0 || ws === 7 ? 7 : (ws || 1);

  const pending = (task.checklist || []).filter(i => !i.done);
  if (pending.length) {
    const ok = await confirmDialog({
      title: 'Checklist chưa hoàn thành',
      message: `Còn ${pending.length}/${task.checklist.length} bước chưa xong trong "${task.title}".`,
      details: 'Bạn vẫn muốn đánh dấu công việc là hoàn thành?',
      okLabel: 'Vẫn hoàn thành',
    });
    if (!ok) return false;
  }
  const saved = await save('tasks', { ...task, status: 'done', doneAt: today() });
  if (timer.activeTimer()?.taskId === task.id) await timer.stop();

  const next = nextRecurringTask(saved);
  if (next) {
    await save('tasks', next);
    toast('Đã hoàn thành. Đã tạo lần lặp tiếp theo.', 'success');
  } else {
    toast('Đã hoàn thành công việc.', 'success');
  }
  return true;
}

async function reopenTask(task) {
  await save('tasks', { ...task, status: 'doing', doneAt: '' });
  toast('Đã mở lại công việc.', 'success');
}

async function setTaskStatus(task, status) {
  if (status === 'done') return completeTask(task);
  await save('tasks', { ...task, status });
  return true;
}

async function deleteTask(task) {
  const sessions = all('sessions').filter(s => s.taskId === task.id);
  const ok = await confirmDialog({
    title: 'Xoá công việc',
    message: `Xoá "${task.title}"?`,
    details: sessions.length ? `${sessions.length} phiên làm việc đã ghi nhận của công việc này cũng sẽ bị xoá.` : '',
    okLabel: 'Xoá', danger: true,
  });
  if (!ok) return false;
  if (timer.activeTimer()?.taskId === task.id) await timer.discard();
  await remove('tasks', task.id);
  toast('Đã xoá công việc.', 'success');
  return true;
}

async function deleteRecord(name, rec, label) {
  const extra = [];
  if (name === 'contents') {
    const m = all('metrics').filter(x => x.contentId === rec.id).length;
    const t = all('tasks').filter(x => x.contentId === rec.id).length;
    if (m) extra.push(`${m} lần đo hiệu quả sẽ bị xoá.`);
    if (t) extra.push(`${t} công việc liên kết sẽ được gỡ liên kết (không xoá).`);
  }
  if (name === 'events') {
    const t = all('tasks').filter(x => x.eventId === rec.id).length;
    if (t) extra.push(`${t} công việc liên kết sẽ được gỡ liên kết.`);
  }
  if (name === 'ideas') {
    const c = all('contents').filter(x => x.ideaId === rec.id).length;
    if (c) extra.push(`${c} nội dung sẽ mất liên kết tới ý tưởng này.`);
  }
  const ok = await confirmDialog({
    title: `Xoá ${label}`,
    message: `Xoá "${rec.title}"? Thao tác không thể hoàn tác.`,
    details: extra.join(' '),
    okLabel: 'Xoá', danger: true,
  });
  if (!ok) return false;
  await remove(name, rec.id);
  toast(`Đã xoá ${label}.`, 'success');
  return true;
}

__M["js/agenda.js"] = (() => {
// Nguồn lịch duy nhất: mọi màn hình lấy sự kiện từ đây, không tạo bản ghi lịch riêng.
const { all } = __M["js/store.js"];
const { inRange, isOverdue } = __M["js/logic.js"];
const { fmtDate } = __M["js/util.js"];

const LAYERS = [
  { k: 'task', l: 'Công việc & deadline' },
  { k: 'recurring', l: 'Công việc định kỳ' },
  { k: 'shoot', l: 'Lịch quay' },
  { k: 'publish', l: 'Lịch đăng' },
  { k: 'milestone', l: 'Mốc duyệt / hoàn thiện' },
  { k: 'event', l: 'Sự kiện & họp' },
];

const ALL_LAYERS = LAYERS.map(l => l.k);

const dateOf = v => String(v || '').slice(0, 10);
const timeOf = v => (String(v || '').includes('T') ? String(v).slice(11, 16) : '');

function agendaItems(from, to, layers = ALL_LAYERS) {
  const has = k => layers.includes(k);
  const out = [];

  for (const t of all('tasks')) {
    if (t.status === 'cancelled') continue;
    const layer = t.recurrence ? 'recurring' : 'task';
    if (!has(layer)) continue;
    if (t.due && inRange(t.due, from, to)) {
      out.push({
        date: dateOf(t.due), time: '', layer, type: 'task', id: t.id,
        title: t.title, label: isOverdue(t) ? 'Quá hạn' : 'Deadline',
        tone: isOverdue(t) ? 'overdue' : 'task',
      });
    }
    if (t.start && t.start !== t.due && inRange(t.start, from, to)) {
      out.push({
        date: dateOf(t.start), time: '', layer, type: 'task', id: t.id,
        title: t.title, label: 'Bắt đầu', tone: 'task',
      });
    }
  }

  for (const c of all('contents')) {
    if (c.stage === 'cancelled') continue;
    const push = (date, layer, label) => {
      if (!date || !has(layer) || !inRange(date, from, to)) return;
      out.push({
        date: dateOf(date), time: '', layer, type: 'content', id: c.id,
        title: c.title, label, tone: 'content',
      });
    };
    push(c.scriptDue, 'milestone', 'Duyệt kịch bản');
    push(c.shootDate, 'shoot', 'Quay');
    push(c.finalDue, 'milestone', 'Hoàn thiện');
    push(c.planPublish, 'publish', 'Đăng dự kiến');
    push(c.actualPublish, 'publish', 'Đã đăng');
  }

  for (const e of all('events')) {
    if (!e.start || !has('event')) continue;
    if (!inRange(e.start, from, to)) continue;
    out.push({
      date: dateOf(e.start), time: timeOf(e.start), layer: 'event', type: 'event', id: e.id,
      title: e.title, label: e.type || 'Sự kiện', tone: 'event',
    });
  }

  return out.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99:99').localeCompare(b.time || '99:99') || a.title.localeCompare(b.title, 'vi'));
}

const dayLabel = d => {
  const dt = new Date(`${d}T00:00:00`);
  const names = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  return `${names[dt.getDay()]}, ${fmtDate(d)}`;
};

function eventDateTime(e) {
  if (!e.start) return '';
  return `${fmtDate(e.start)}${timeOf(e.start) ? ' · ' + timeOf(e.start) : ''}`;
}

return { LAYERS, ALL_LAYERS, agendaItems, dayLabel, eventDateTime };
})();

      if (e.target.closest('[data-timer]')) { await toggleTimer(task); return; }

      if (e.target.closest('[data-note]')) { quickNote(task); return; }

      const [route, id] = alert.dataset.alert.split(':');
      const map = { tasks: 'task', content: 'content', events: 'event' };
      const rec = find(map[route] === 'task' ? 'tasks' : map[route] === 'content' ? 'contents' : 'events', id);

  if (running) view.querySelector('#btn-plan-day')?.blur();
}

const viewMeta = { title: 'Tổng quan', route: 'dashboard' };

return { render, viewMeta };

  if (!view.dataset.bound) { view.dataset.bound = '1'; bind(view); }

}

return { openContentForm, render };

function bar(label, value, max, suffix = '') {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return `<div class="hbar"><span class="lbl" title="${esc(label)}">${esc(label)}</span>
    <span class="track"><span style="width:${pct}%"></span></span>
    <span class="val">${esc(value)}${suffix}</span></div>`;
}

function timeSection(ts, tasks) {
  const expected = ts.byTask.reduce((n, row) => {
    const t = tasks.find(x => x.id === row.id);
    return n + (Number(t?.estimatedMin) || 0);
  }, 0);
  const groups = ts.byGroup.map(([g, m]) => [groupName(g), m]);
  const max = Math.max(1, ...groups.map(([, m]) => m));
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Báo cáo thời gian</h2><div class="spacer"></div>
      <button class="btn sm" data-csv="time">Xuất CSV</button></div>
    <div class="card-body">
      <div class="grid cols-3" style="margin-bottom:10px">
        <div class="card stat"><div class="label">Tổng đã ghi nhận</div><div class="value" style="font-size:22px">${esc(fmtDur(ts.total))}</div><div class="sub">${ts.count} phiên</div></div>
        <div class="card stat"><div class="label">Dự kiến của các việc có ghi giờ</div><div class="value" style="font-size:22px">${esc(fmtDur(expected))}</div></div>
        <div class="card stat"><div class="label">Chênh lệch</div><div class="value" style="font-size:22px">${expected ? ((ts.total / expected - 1) * 100).toFixed(0) + '%' : '—'}</div><div class="sub">Thực tế so với dự kiến</div></div>
      </div>
      ${groups.length ? groups.map(([l, m]) => `<div class="hbar"><span class="lbl" title="${esc(l)}">${esc(l)}</span>
        <span class="track"><span style="width:${Math.round((m / Math.max(1, ...groups.map(x => x[1]))) * 100)}%"></span></span>
        <span class="val">${esc(fmtDur(m))}</span></div>`).join('') : '<p class="small muted">Chưa có thời gian ghi nhận trong kỳ.</p>'}
      ${ts.byTask.length ? `<details class="section" style="margin-top:10px"><summary>Chi tiết theo công việc</summary>
        <div class="section-body table-wrap"><table class="table">
          <thead><tr><th>Công việc</th><th class="num">Thời gian</th><th class="num">Dự kiến</th></tr></thead>
          <tbody>${ts.byTask.map(r => {
            const t = tasks.find(x => x.id === r.id);
            return `<tr><td>${esc(r.title)}</td><td class="num">${esc(fmtDur(r.minutes))}</td>
              <td class="num">${esc(fmtDur(t?.estimatedMin))}</td></tr>`;
          }).join('')}</tbody></table></div></details>` : ''}
      <p class="small muted" style="margin-top:8px">Thời gian lấy từ các phiên làm việc và các lần nhập tay, không dùng trường ước lượng.</p>
    </div>
  </div>`;
}

function performanceSection(from, to) {
  const metrics = all('metrics').filter(m => inRange(m.date, from, to));
  if (!metrics.length) return '';
  const contents = new Map(all('contents').map(c => [c.id, c]));
  const rows = metrics.map(m => ({ m, c: contents.get(m.contentId) })).filter(x => x.c);
  const byPlatform = {};
  for (const { m, c } of rows) {
    const k = c.platform || 'Khác';

    a.views += Number(m.views) || 0;
    a.eng += (m.likes || 0) + (m.comments || 0) + (m.shares || 0) + (m.saves || 0);
    const r = metricsRate(m);
    if (r !== null) { a.rate += r; a.rn++; }
    byPlatform[k] = a;
  }
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Hiệu quả nội dung trong kỳ</h2><div class="spacer"></div>
      <button class="btn sm" data-csv="metrics">Xuất CSV</button></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Nội dung</th><th>Nền tảng</th><th class="num">Ngày đo</th><th class="num">Xem</th><th class="num">Tương tác</th><th class="num">Tỷ lệ</th></tr></thead>
      <tbody>${rows.map(({ m, c }) => `<tr><td>${esc(c.title)}</td><td>${esc(c.platform || '—')}</td>
        <td class="num">${esc(fmtDate(m.date))}</td><td class="num">${Number(m.views || 0).toLocaleString('vi-VN')}</td>
        <td class="num">${((m.likes || 0) + (m.comments || 0) + (m.shares || 0) + (m.saves || 0)).toLocaleString('vi-VN')}</td>
        <td class="num">${metricsRate(m) === null ? '—' : metricsRate(m).toFixed(2) + '%'}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="card-body"><div class="grid cols-3">
      ${Object.entries(byPlatform).map(([k, a]) => `<div><h3>${esc(k)}</h3>
        <p class="small muted">${a.n} lần đo · ${a.views.toLocaleString('vi-VN')} lượt xem<br>
        Tỷ lệ tương tác TB: ${a.rn ? (a.rate / a.rn).toFixed(2) + '%' : '—'}</p></div>`).join('')}
    </div>
    <p class="small muted" style="margin-top:8px">Chỉ tổng hợp số liệu đã nhập. Không suy ra doanh thu/chuyển đổi khi chưa có dữ liệu nguồn.</p></div>
  </div>`;
}

function summarySection(stats, cs, ts) {
  const reasons = {};
  for (const t of stats.list) {
    if (t.delayReason) reasons[t.delayReason.trim()] = (reasons[t.delayReason.trim()] || 0) + 1;
  }
  const topReasons = Object.entries(reasons).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const suggestions = [];
  if (stats.overdue) suggestions.push(`Có ${stats.overdue} công việc quá hạn. Ưu tiên xử lý hoặc điều chỉnh deadline có ghi lý do.`);
  if (stats.total) {
    const adhocPct = Math.round((stats.adhoc / stats.total) * 100);
    if (adhocPct >= 30) suggestions.push(`Việc phát sinh/hỗ trợ chiếm ${adhocPct}% khối lượng — nên chừa 20–30% quỹ thời gian mỗi tuần.`);
  }
  if (cs.planned > cs.published) suggestions.push(`Kế hoạch đăng ${cs.planned} nội dung nhưng mới đăng ${cs.published}. Kiểm tra các mốc duyệt và lịch quay.`);
  if (cs.late) suggestions.push(`${cs.late} nội dung đăng trễ so với kế hoạch. Xem lại thời gian duyệt bản dựng.`);
  if (stats.ontimeRate !== null && stats.ontimeRate < 70) suggestions.push(`Tỷ lệ đúng hạn ${stats.ontimeRate.toFixed(0)}% — nên giảm số việc cam kết mỗi ngày hoặc tăng thời lượng dự kiến.`);
  if (!suggestions.length) suggestions.push('Không có dấu hiệu bất thường trong kỳ. Tiếp tục ghi nhận thời gian để báo cáo chính xác hơn.');

  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Tổng kết & đề xuất</h2><div class="spacer"></div>
      <button class="btn sm" data-csv="summary">Xuất CSV</button></div>
    <div class="card-body">
      <p><b>Đã hoàn thành ${stats.done} công việc, đăng ${cs.published} nội dung, ghi nhận ${esc(fmtDur(ts.total))}.</b></p>
      <p class="small">Còn ${stats.waiting + stats.onhold} việc đang chờ/tạm hoãn và ${stats.overdue} việc quá hạn.</p>
      <h3 style="margin-top:10px">Nguyên nhân chậm thường gặp</h3>
      ${topReasons.length ? `<ul class="small">${topReasons.map(([r, n]) => `<li>${esc(r)} — ${n} lần</li>`).join('')}</ul>`
        : '<p class="small muted">Chưa ghi nhận lý do trì hoãn. Thêm lý do khi chuyển việc để báo cáo có ích hơn.</p>'}
      <h3 style="margin-top:10px">Đề xuất điều chỉnh</h3>
      <ul class="small">${suggestions.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    </div>
  </div>`;
}

function render(view, params = {}) {
  applyParams(params);
  const { from, to, label } = range();
  const tasks = all('tasks');
  const contents = all('contents');
  const sessions = all('sessions');
  const stats = workStats(tasks, from, to);
  const cs = contentStats(contents, from, to);
  const ts = timeStats(sessions, from, to, tasks);
  const ideasCount = all('ideas').filter(i => inRange(i.createdAt, from, to)).length;

  view.innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-body">
      <div class="row">
        <b>Kỳ báo cáo:</b>
        <div class="tabs" style="margin:0;border:0">
          ${[['day', 'Ngày'], ['week', 'Tuần'], ['month', 'Tháng']].map(([k, l]) =>
            `<button data-period="${k}" class="${!state.custom && state.period === k ? 'active' : ''}">${l}</button>`).join('')}
        </div>
        <span class="small muted">${esc(label)}</span>
        <span class="spacer"></span>
        <button class="btn sm" data-shift="-1">‹ Trước</button>
        <button class="btn sm" data-ref-today>Hôm nay</button>
        <button class="btn sm" data-shift="1">Sau ›</button>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="small muted">Hoặc chọn khoảng:</label>
        <input type="date" data-from value="${esc(state.from)}" style="width:auto">
        <span>→</span>
        <input type="date" data-to value="${esc(state.to)}" style="width:auto">
        <button class="btn sm" data-apply-range>Áp dụng</button>
        ${state.custom ? '<button class="btn sm ghost" data-clear-range>Bỏ khoảng tuỳ chọn</button>' : ''}
      </div>
    </div></div>

    ${workSection(from, to, stats)}
    ${contentSection(from, to, cs, ideasCount)}
    ${timeSection(ts, tasks)}
    ${performanceSection(from, to)}
    ${summarySection(stats, cs, ts)}

    <div class="card"><div class="card-head"><h2>Xuất dữ liệu</h2></div><div class="card-body">
      <div class="row">
        <button class="btn" data-csv="tasks">Công việc (CSV)</button>
        <button class="btn" data-csv="contents">Nội dung (CSV)</button>
        <button class="btn" data-csv="time">Phiên thời gian (CSV)</button>
        <button class="btn" data-csv="metrics">Số liệu hiệu quả (CSV)</button>
      </div>
      <p class="small muted" style="margin:8px 0 0">File CSV dùng UTF-8 kèm BOM để Excel hiển thị đúng tiếng Việt. Xuất bản sao lưu đầy đủ ở trang Cài đặt.</p>
    </div></div>
  `;

  view.querySelectorAll('[data-period]').forEach(btn => btn.addEventListener('click', () => {
    state.period = btn.dataset.period;
    state.custom = false;
    render(view);
  }));
  view.querySelectorAll('[data-shift]').forEach(btn => btn.addEventListener('click', () => {
    const n = Number(btn.dataset.shift);
    if (state.period === 'day') state.ref = addDays(state.ref, n);
    else if (state.period === 'week') state.ref = addDays(state.ref, 7 * n);
    else {
      const d = new Date(`${state.ref}T00:00:00`);
      d.setMonth(d.getMonth() + n);
      state.ref = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    state.custom = false;
    render(view);
  }));
  view.querySelector('[data-ref-today]')?.addEventListener('click', () => { state.ref = today(); state.custom = false; render(view); });
  view.querySelector('[data-apply-range]')?.addEventListener('click', () => {
    const f = view.querySelector('[data-from]').value;
    const t = view.querySelector('[data-to]').value;
    if (!f || !t) return;
    if (f > t) return;
    state.from = f; state.to = t; state.custom = true;
    render(view);
  });
  view.querySelector('[data-clear-range]')?.addEventListener('click', () => { state.custom = false; render(view); });

  view.querySelectorAll('[data-csv]').forEach(btn => btn.addEventListener('click', () => {
    const kind = btn.dataset.csv;
    if (kind === 'tasks') {
      const rows = scopeTasks(tasks, from, to).map(t => [t.title, groupName(t.groupId), t.priority, t.status, fmtDate(t.due), fmtDate(t.doneAt), t.estimatedMin || 0, sessionMinutes(sessions, t.id), t.project || '', (t.tags || []).join('; ')]);
      csv('cong-viec', ['Tên', 'Nhóm', 'Ưu tiên', 'Trạng thái', 'Deadline', 'Ngày hoàn thành', 'Dự kiến (phút)', 'Thực tế (phút)', 'Dự án', 'Nhãn'], rows);
    } else if (kind === 'contents') {
      const rows = contents.filter(c => inRange(publishDate(c), from, to) || inRange(c.planPublish, from, to))
        .map(c => [c.title, c.platform, c.format, c.goal, c.stage, fmtDate(c.planPublish), fmtDate(c.actualPublish), c.publishLink || '', c.product || '', c.brand || '']);
      csv('noi-dung', ['Tên', 'Nền tảng', 'Định dạng', 'Mục tiêu', 'Giai đoạn', 'Đăng dự kiến', 'Đăng thực tế', 'Link', 'Sản phẩm', 'Thương hiệu'], rows);
    } else if (kind === 'time') {
      const rows = sessions.filter(s => inRange(s.date || s.startedAt, from, to)).map(s => {
        const t = tasks.find(x => x.id === s.taskId);
        return [fmtDate(s.date), t?.title || '', s.minutes || 0, s.note || '', s.manual ? 'Nhập tay' : 'Bộ đếm', s.startedAt || '', s.endedAt || ''];
      });
      csv('thoi-gian', ['Ngày', 'Công việc', 'Số phút', 'Ghi chú', 'Nguồn', 'Bắt đầu', 'Kết thúc'], rows);
    } else if (kind === 'metrics') {
      const contentsMap = new Map(contents.map(c => [c.id, c]));
      const rows = all('metrics').filter(m => inRange(m.date, from, to)).map(m => {
        const c = contentsMap.get(m.contentId);
        return [c?.title || '(đã xoá)', c?.platform || m.platform || '', fmtDate(m.date), m.views || 0, m.reach || 0, m.likes || 0,
          m.comments || 0, m.shares || 0, m.saves || 0, m.completionRate || 0, m.clicks || 0, m.conversions || 0, m.notes || ''];
      });
      csv('hieu-qua', ['Nội dung', 'Nền tảng', 'Ngày đo', 'Xem', 'Tiếp cận', 'Thích', 'Bình luận', 'Chia sẻ', 'Lưu', 'Xem hết (%)', 'Nhấp', 'Chuyển đổi', 'Ghi chú'], rows);
    } else if (kind === 'summary') {
      const rows = [
        ['Kỳ báo cáo', label],
        ['Tổng công việc', stats.total],
        ['Hoàn thành', stats.done],
        ['Đang làm', stats.doing],
        ['Chờ / tạm hoãn', stats.waiting + stats.onhold],
        ['Quá hạn hiện tại', stats.overdue],
        ['Đúng hạn (%)', stats.ontimeRate === null ? '' : stats.ontimeRate.toFixed(1)],
        ['Mẫu số đúng hạn', stats.ontimeBase],
        ['Việc phát sinh', stats.adhoc],
        ['Đã huỷ', stats.cancelled],
        ['Ý tưởng ghi nhận', ideasCount],
        ['Kịch bản', cs.scripts],
        ['Đã quay', cs.shot],
        ['Đã dựng', cs.edited],
        ['Đã xuất bản', cs.published],
        ['Đăng trễ', cs.late],
        ['Thời gian ghi nhận (phút)', ts.total],
      ];
      csv('tong-ket', ['Chỉ số', 'Giá trị'], rows);
    }
  }));
}

return { render };
})();

function toCsv(headers, rows) {
  return '\ufeff' + [headers, ...rows].map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n\r;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\r\n');
}

async function removeSamples() {

}

function integrity() {
  const contents = new Set(all('contents').map(c => c.id));
  const tasks = new Set(all('tasks').map(t => t.id));
  const ideas = new Set(all('ideas').map(i => i.id));
  const events = new Set(all('events').map(e => e.id));
  const issues = [];
  for (const m of all('metrics')) if (m.contentId && !contents.has(m.contentId)) issues.push(['metrics', m.id, `Số liệu ngày ${fmtDate(m.date)} trỏ tới nội dung đã xoá`]);
  for (const t of all('tasks')) if (t.contentId && !contents.has(t.contentId)) issues.push(['tasks', t.id, `Công việc "${t.title}" trỏ tới nội dung đã xoá`]);
  for (const t of all('tasks')) if (t.eventId && !events.has(t.eventId)) issues.push(['tasks', t.id, `Công việc "${t.title}" trỏ tới sự kiện đã xoá`]);
  for (const s of all('sessions')) if (s.taskId && !tasks.has(s.taskId)) issues.push(['sessions', s.id, `Phiên làm việc ${fmtDate(s.date)} trỏ tới công việc đã xoá`]);
  for (const c of all('contents')) if (c.ideaId && !ideas.has(c.ideaId)) issues.push(['contents', c.id, `Nội dung "${c.title}" trỏ tới ý tưởng đã xoá`]);
  return issues;
}

function openIntegrity() {
  const issues = integrity();
  openModal({
    title: 'Kiểm tra toàn vẹn dữ liệu',
    wide: true,
    content: issues.length
      ? `<p>Phát hiện ${issues.length} liên kết trỏ tới bản ghi không còn tồn tại. Dữ liệu chính vẫn an toàn.</p>

        <div class="notice">Có thể gỡ các liên kết hỏng này. Không bản ghi nào bị xoá.</div>`
      : '<p>Không phát hiện liên kết hỏng. Dữ liệu nhất quán.</p>',
    actions: issues.length ? [
      {
        label: 'Gỡ liên kết hỏng', cls: 'primary', onClick: async (close) => {
          const { save } = await Promise.resolve(__M["js/store.js"]);
          try {
            const seen = new Set();
            for (const [store, id] of issues) {
              if (seen.has(`${store}:${id}`)) continue;
              seen.add(`${store}:${id}`);
              const { find } = await Promise.resolve(__M["js/store.js"]);
              const rec = find(store, id);
              if (!rec) continue;
              const patch = store === 'metrics' ? { contentId: '' }
                : store === 'sessions' ? { taskId: '', contentId: '' }
                : { contentId: '', eventId: '', ideaId: '' };
              await save(store, { ...rec, ...patch });
            }
            close();
            toast('Đã gỡ các liên kết hỏng.', 'success');
          } catch (e) { toast('Không sửa được: ' + e.message, 'error'); }
        },
      },
      { label: 'Đóng', cls: 'ghost', onClick: c => c() },
    ] : [{ label: 'Đóng', cls: 'ghost', onClick: c => c() }],
  });
}

  window.addEventListener('cw-readonly', () => toast('Chế độ chỉ xem: không thể sửa dữ liệu.', 'error'));
  $('#today-label').textContent = `${['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'][new Date().getDay()]}, ${fmtDate(today())}`;

  $('#menu-btn').addEventListener('click', () => {
    $('#sidebar').classList.toggle('open');
    $('#scrim').hidden = !$('#sidebar').classList.contains('open');
  });
  $('#scrim').addEventListener('click', () => {
    $('#sidebar').classList.remove('open');
    $('#scrim').hidden = true;
  });

  $('#btn-quick').addEventListener('click', e => {
    e.stopPropagation();
    quickMenu();
    const pop = $('#menu-pop');
    pop.hidden = !pop.hidden;
    $('#bell-pop').hidden = true;
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#menu-pop') && !e.target.closest('#btn-quick')) $('#menu-pop').hidden = true;
    if (!e.target.closest('#bell-pop') && !e.target.closest('#btn-bell')) $('#bell-pop').hidden = true;
    if (!e.target.closest('#search-results') && !e.target.closest('#global-search')) $('#search-results').hidden = true;
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      $('#menu-pop').hidden = true;
      $('#bell-pop').hidden = true;
      $('#search-results').hidden = true;
      $('#sidebar').classList.remove('open');
      $('#scrim').hidden = true;
    }
  });

  $('#menu-pop').addEventListener('click', e => {
    const b = e.target.closest('[data-quick]');
    if (b) handleQuick(b.dataset.quick);
  });

  $('#btn-bell').addEventListener('click', e => {
    e.stopPropagation();
    renderBell();
    $('#bell-pop').hidden = !$('#bell-pop').hidden;
    $('#menu-pop').hidden = true;
  });

  $('#bell-pop').addEventListener('click', e => {
    const s = e.target.closest('[data-bell-settings]');
    if (s) { $('#bell-pop').hidden = true; location.hash = '#/settings'; return; }
    const row = e.target.closest('[data-alert-index]');
    if (row) openAlert(lastAlerts[Number(row.dataset.alertIndex)]);
  });

  $('#global-search').addEventListener('input', e => runSearch(e.target.value));
  $('#global-search').addEventListener('focus', e => { if (e.target.value) runSearch(e.target.value); });
  $('#global-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      $('#search-results').hidden = true;
      if (q) location.hash = `#/tasks?q=${encodeURIComponent(q)}`;
    }
  });
  $('#search-results').addEventListener('click', e => {
    const b = e.target.closest('[data-result]');
    if (!b) return;
    const list = JSON.parse($('#search-results').dataset.results || '[]');
    const item = list[Number(b.dataset.result)];
    $('#search-results').hidden = true;
    $('#global-search').value = '';
    if (item) {
      const rec = find(item.type === 'task' ? 'tasks' : item.type === 'content' ? 'contents' : item.type === 'idea' ? 'ideas' : item.type === 'event' ? 'events' : 'resources', item.id);
      if (rec) openForm(item.type, rec);
    }
  });

  $('#timer-widget').addEventListener('click', async e => {
    const t = timer.activeTimer();
    if (!t) return;
    if (e.target.closest('[data-timer-toggle]')) {
      if (isRunning(t)) await timer.pause(); else await timer.resume();
      renderTimer();
    }
    if (e.target.closest('[data-timer-stop]')) {
      const task = find('tasks', t.taskId);
      const ok = await confirmDialog({
        title: 'Kết thúc bộ đếm',
        message: `Ghi nhận ${timer.clockLabel(t)} cho "${task?.title || 'công việc'}"?`,
        okLabel: 'Kết thúc và lưu',
      });
      if (!ok) return;
      const r = await timer.stop();
      if (r) toast(`Đã ghi nhận ${fmtDur(r.minutes)}.`, 'success');
      renderTimer();
    }
  });

  window.addEventListener('hashchange', () => {
    if (parseHash().route !== currentRoute) {
      $('#sidebar').classList.remove('open');
      $('#scrim').hidden = true;
    }
    renderRoute(false);
  });

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window.__deferredPrompt = e;
  });
}

async function boot() {
  if (window.__cwReady) await window.__cwReady;
  try {
    await store.init();
  } catch (e) {
    console.error(e);
    document.getElementById('view').innerHTML = `<div class="notice bad">Không mở được cơ sở dữ liệu trên trình duyệt này. Hãy dùng Chrome, Edge, Firefox hoặc Safari phiên bản mới và không mở ở chế độ ẩn danh.<br><span class="small">${esc(e.message)}</span></div>`;
    return;
  }

  applyTheme();
  buildNav();
  bindShell();
  if (!location.hash) location.hash = '#/dashboard';

  store.subscribe((type) => {
    updateCounts();
    if (type === 'timer') renderTimer();
    scheduleRender();
  });

  renderRoute(false);
  renderTimer();
  setInterval(renderTimer, 1000);

  // Thông báo nền chỉ khi đã có quyền; không tự xin quyền khi mở app.
  setTimeout(() => {
    try { sendDailyDigest(); } catch (e) { console.warn(e); }
  }, 2500);

  // Firebase là tùy chọn: chưa điền FIREBASE_CONFIG thì không tải SDK.
  initCloud().catch(e => console.warn('Firebase:', e));
}

boot();

return {  };
})();

</script>
</body>
</html>
